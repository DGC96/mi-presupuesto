<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi presupuesto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#16232E; --muted:#5D6B78;
  --line:#D5DDE4; --good:#1F8A70; --goodsoft:#D6EFE7; --warn:#C8811A; --bad:#C2413B; --badsoft:#F6DCDA;
  --accent:#23507A; --track:#DCE3EA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1720; --surface:#17222D; --ink:#E7EEF4; --muted:#93A3B2;
    --line:#2A3846; --good:#4CC39E; --goodsoft:#173A31; --warn:#E3A44A; --bad:#EE7A73; --badsoft:#3E2222;
    --accent:#8DB8E0; --track:#24313E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1720; --surface:#17222D; --ink:#E7EEF4; --muted:#93A3B2;
  --line:#2A3846; --good:#4CC39E; --goodsoft:#173A31; --warn:#E3A44A; --bad:#EE7A73; --badsoft:#3E2222;
  --accent:#8DB8E0; --track:#24313E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px))}
.num{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mes h1{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:1.05rem;font-weight:600;margin:0}
.flecha{background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:1.1rem;color:var(--muted)}

.hero{padding:6px 0 22px}
.hero .quedan{font-size:.95rem;color:var(--muted);margin:0}
.hero .cifra{font-size:clamp(2.8rem,13vw,4rem);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:2px 0 4px}
.hero .cifra.negativo{color:var(--bad)}
.hero .de{color:var(--muted);margin:0 0 18px}
.hero .de button{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px}

.barra{position:relative;height:18px;background:var(--track);border-radius:9px;overflow:visible}
.barra .lleno{height:100%;border-radius:9px;background:var(--good);transition:width .4s ease}
.barra .ritmo{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.leyenda{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:8px}

.diario{margin-top:20px;padding:16px 18px;border-radius:14px;background:var(--goodsoft)}
.diario.mal{background:var(--badsoft)}
.diario p{margin:0}
.diario .grande{font-size:1.6rem;font-weight:600}
.diario .sub{font-size:.9rem;color:var(--muted);margin-top:2px}

section{margin-top:30px}
h2{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:1rem;font-weight:600;margin:0 0 12px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:4px}
.form .ancho{grid-column:1/-1}
.form input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;width:100%;min-width:0}
.form input.importe{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:1.25rem}
.primario{grid-column:1/-1;background:var(--accent);color:var(--surface);border:none;border-radius:10px;padding:14px;font-weight:600;font-size:1rem}
.error{grid-column:1/-1;color:var(--bad);font-size:.88rem;margin:0;min-height:0}

.grafico{overflow-x:auto}
.grafico svg{display:block;width:100%;height:auto;min-width:300px}

.dia{margin-bottom:16px}
.dia-cab{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.gasto{display:flex;align-items:center;gap:10px;padding:8px 0}
.gasto .concepto{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gasto .imp{font-weight:600}
.borrar{background:none;border:none;color:var(--muted);font-size:1.2rem;width:32px;height:32px;border-radius:8px}
.borrar:hover{background:var(--track)}
.vacio{color:var(--muted);margin:0}

.config{padding:30px 0}
.config p{color:var(--muted);margin:0 0 14px}
.config .fila{display:flex;gap:10px}
.config input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:1.4rem;font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif}
.config .campo{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);margin-bottom:14px}
.config .campo input{flex:none;width:100%}
.config .fila button{flex:1;padding:14px 20px}
.config .secundario{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.banco{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.banco > div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.banco .etq{font-size:.82rem;color:var(--muted);margin:0;line-height:1.3}
.banco .valor{font-size:1.25rem;font-weight:600;margin:4px 0 0}
.banco .valor.negativo{color:var(--bad)}
.ajustar{background:none;border:none;color:var(--accent);padding:10px 0 0;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.config button{background:var(--accent);color:var(--surface);border:none;border-radius:10px;padding:0 20px;font-weight:600}
.selector{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;margin-bottom:14px}
.selector button{border:none;background:none;padding:8px 18px;border-radius:8px;font-weight:600;color:var(--muted)}
.selector button.activo{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.form .check{flex-direction:row;align-items:center;gap:10px;font-size:.92rem;color:var(--ink)}
.form .check input{width:22px;height:22px;flex:none;accent-color:var(--good)}
.primario.verde{background:var(--good)}
.gasto.ingreso .imp{color:var(--good)}
.nota-ingresos{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.cab-seccion{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cab-seccion h2{margin-bottom:4px}
.total-fijos{font-weight:600}
.fijo{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fijo-dia{width:40px;height:40px;flex:none;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600}
.fijo.hecho .fijo-dia{background:var(--goodsoft);border-color:transparent;color:var(--good)}
.fijo-info{flex:1;min-width:0;display:flex;flex-direction:column}
.fijo-nombre{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fijo-sub{font-size:.82rem;color:var(--muted)}
.fijo.hecho .imp{color:var(--muted)}
.fijo .imp{font-weight:600}
.fijo-form{margin-top:14px}
.secundario-btn{background:var(--surface);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:14px;font-weight:600}
.primario.mitad{grid-column:auto}
.gasto[data-id]{cursor:pointer;border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:0}
.gasto[data-id]:active{background:var(--track)}
.gasto.editando{background:var(--track);outline:2px solid var(--accent)}
.editando-aviso{font-size:.88rem;font-weight:600;color:var(--accent);margin:0 0 8px}
.pista{font-size:.82rem;color:var(--muted);margin:-6px 0 10px}
.copia{display:flex;gap:10px;flex-wrap:wrap}
.copia button,.copia label{flex:1;min-width:140px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:600;color:var(--accent);cursor:pointer}
.copia input{display:none}
.copia-nota{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.aviso{font-size:.8rem;color:var(--muted);margin-top:36px;text-align:center}
@media (prefers-reduced-motion:reduce){.barra .lleno{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mes">
    <button class="flecha" id="prev" aria-label="Mes anterior">‹</button>
    <h1 id="titulo-mes"></h1>
    <button class="flecha" id="next" aria-label="Mes siguiente">›</button>
  </div>
  <div id="app"><p class="vacio">Cargando…</p></div>
  <section>
    <h2>Copia de seguridad</h2>
    <p class="copia-nota">Tus datos se guardan solo en este iPhone. Haz una copia de vez en cuando y guárdala en Archivos o iCloud Drive.</p>
    <div class="copia">
      <button id="exportar">Guardar copia</button>
      <label>Restaurar copia<input type="file" id="importar" accept="application/json,.json"></label>
    </div>
  </section>
  <p class="aviso" id="aviso"></p>
</main>

<script>
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const fmt = n => eur.format(n);
const hoy = new Date();
const pad = n => String(n).padStart(2,'0');
const isoHoy = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;
const INICIO = {y:2026, m:10}; // noviembre 2026 (m 0-11)
let vista = {y:hoy.getFullYear(), m:hoy.getMonth()};
if(vista.y*12+vista.m < INICIO.y*12+INICIO.m) vista = {...INICIO};
let estado = {meses:{}};
let editandoLimite = false;
const LS_KEY = 'presupuesto-v1';

const claveMes = (y,m) => `${y}-${pad(m+1)}`;
const diasEnMes = (y,m) => new Date(y,m+1,0).getDate();
const nombreMes = (y,m) => { const t = new Date(y,m,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); };
const mesActual = () => estado.meses[claveMes(vista.y,vista.m)];

const num = v => { const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n) ? NaN : Math.round(n*100)/100; };
const totalGastos = mes => mes.gastos.reduce((s,g)=>s+g.importe,0);
const totalIngresos = mes => (mes.ingresos||[]).reduce((s,g)=>s+g.importe,0);
const extraLimite = mes => (mes.ingresos||[]).filter(g=>g.alLimite).reduce((s,g)=>s+g.importe,0);
const nuevoId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tipoMov = 'gasto';
let fijoFormAbierto = false;
// ---- Importar pagos de Apple Pay (archivo creado por el atajo) ----
function parseImporte(t){
  let x = String(t).replace(/[^\d,.\-−]/g,'').replace('−','-');
  const neg = x.startsWith('-'); x = x.replace(/-/g,'');
  const c = x.lastIndexOf(','), d = x.lastIndexOf('.');
  if(c>=0 && d>=0){ x = c>d ? x.replace(/\./g,'').replace(',','.') : x.replace(/,/g,''); }
  else if(c>=0){ x = x.replace(/,/g,(m,i)=> i===c ? '.' : ''); }
  else if(d>=0 && /^\d{1,3}(\.\d{3})+$/.test(x)){ x = x.replace(/\./g,''); }
  const n = parseFloat(x);
  return isNaN(n) ? NaN : Math.round((neg?-n:n)*100)/100;
}
function parseFecha(t){
  t = String(t).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}
function importarApplePay(texto){
  estado.importados = estado.importados || [];
  const vistos = new Set(estado.importados);
  let nuevos = 0, ignorados = 0, malos = 0;
  texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(linea=>{
    const partes = linea.split(';');
    if(partes.length < 2){ malos++; return; }
    const fecha = parseFecha(partes[0]);
    const importe = parseImporte(partes[1]);
    const comercio = partes.slice(2).join(';').trim();
    if(!fecha || isNaN(importe) || importe===0){ malos++; return; }
    if(vistos.has(linea)) return;
    vistos.add(linea); estado.importados.push(linea);
    const [y,mm] = fecha.split('-').map(Number);
    if(y*12+(mm-1) < INICIO.y*12+INICIO.m){ ignorados++; return; }
    const k = `${y}-${pad(mm)}`;
    estado.meses[k] = estado.meses[k] || {gastos:[]};
    const mesK = estado.meses[k];
    mesK.ingresos = mesK.ingresos || [];
    const mov = {id: nuevoId(), importe: Math.abs(importe), concepto: comercio || 'Apple Pay', fecha, origen:'applepay'};
    if(importe < 0){ mov.concepto = 'Devolución ' + (comercio||''); mov.alLimite = true; mesK.ingresos.push(mov); }
    else mesK.gastos.push(mov);
    nuevos++;
  });
  if(estado.importados.length > 3000) estado.importados = estado.importados.slice(-3000);
  return {nuevos, ignorados, malos};
}

let editMov = null; // {id, tipo} del movimiento que se está modificando

// ---- Pagos fijos (letras, cuotas, recibos) ----
const idxMes = k => { const [y,m] = k.split('-').map(Number); return y*12 + (m-1); };
function fijosDelMes(k){
  const [y,m] = k.split('-').map(Number);
  const nDias = diasEnMes(y, m-1);
  return (estado.fijos||[]).filter(f=>{
    const n = idxMes(k) - idxMes(f.desde);
    if(n < 0) return false;
    if(f.cuotas && n >= f.cuotas) return false;
    if(f.hasta && idxMes(k) > idxMes(f.hasta)) return false;
    return true;
  }).map(f=>{
    const n = idxMes(k) - idxMes(f.desde);
    const dia = Math.min(f.dia, nDias);
    return {...f, diaReal: dia, fecha: `${k}-${pad(dia)}`, numCuota: n+1};
  }).sort((a,b)=>a.diaReal-b.diaReal);
}
// ¿Ya se ha cobrado a día de hoy?
const cobrado = f => f.fecha <= isoHoy;
const sumaFijos = k => fijosDelMes(k).reduce((s,f)=>s+f.importe,0);
const sumaFijosCobrados = k => fijosDelMes(k).filter(cobrado).reduce((s,f)=>s+f.importe,0);

function saldoSugerido(){
  // saldo final estimado del mes anterior
  const prev = new Date(vista.y, vista.m-1, 1);
  const mp = estado.meses[claveMes(prev.getFullYear(), prev.getMonth())];
  if(mp && typeof mp.saldoInicial==='number') return Math.round((mp.saldoInicial + totalIngresos(mp) - totalGastos(mp) - sumaFijos(claveMes(prev.getFullYear(), prev.getMonth())))*100)/100;
  return '';
}

function limiteSugerido(){
  // usa el límite del mes anterior más reciente como sugerencia
  const claves = Object.keys(estado.meses).sort();
  for(let i=claves.length-1;i>=0;i--){ if(estado.meses[claves[i]].limite) return estado.meses[claves[i]].limite; }
  return '';
}

async function guardar(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(estado));
  }catch(e){
    document.getElementById('aviso').textContent = 'No se pudo guardar el último cambio. Revisa que el iPhone tenga espacio libre.';
  }
}

function render(){
  document.getElementById('titulo-mes').textContent = nombreMes(vista.y,vista.m);
  document.getElementById('prev').style.visibility = (vista.y*12+vista.m <= INICIO.y*12+INICIO.m) ? 'hidden' : 'visible';
  const app = document.getElementById('app');
  const mes = mesActual();

  if(!mes || !mes.limite || typeof mes.saldoInicial!=='number' || editandoLimite){
    const gastado = mes ? totalGastos(mes) : 0;
    const ingresado = mes ? totalIngresos(mes) : 0;
    const saldoVal = (mes && typeof mes.saldoInicial==='number') ? Math.round((mes.saldoInicial+ingresado-gastado-sumaFijosCobrados(claveMes(vista.y,vista.m)))*100)/100 : saldoSugerido();
    const limVal = mes?.limite || limiteSugerido();
    app.innerHTML = `
      <div class="config">
        <h2>Prepara ${nombreMes(vista.y,vista.m).toLowerCase()}</h2>
        <p>${(gastado>0||ingresado>0) ? 'Pon lo que te aparece ahora mismo en el banco.' : 'Pon el dinero que tienes en el banco y cuánto quieres gastar como máximo este mes.'}</p>
        <label class="campo">Dinero en el banco${(gastado>0||ingresado>0)?' ahora':''} (€)
          <input id="saldo" class="num" type="text" inputmode="decimal" placeholder="1.200" value="${saldoVal}">
        </label>
        <label class="campo">Máximo que quiero gastar este mes (€)
          <input id="lim" class="num" type="text" inputmode="decimal" placeholder="500" value="${limVal}">
        </label>
        <p class="error" id="cfg-err"></p>
        <div class="fila">
          ${mes && mes.limite && typeof mes.saldoInicial==='number' ? '<button id="cancelar" class="secundario">Cancelar</button>' : ''}
          <button id="guardar-lim">Guardar</button>
        </div>
      </div>`;
    const ok = async ()=>{
      const saldo = num(document.getElementById('saldo').value);
      const lim = num(document.getElementById('lim').value);
      const err = document.getElementById('cfg-err');
      if(isNaN(saldo)){ err.textContent = 'Escribe el dinero que tienes en el banco.'; return; }
      if(!(lim>0)){ err.textContent = 'Escribe un máximo de gasto mayor que cero.'; return; }
      const k = claveMes(vista.y,vista.m);
      estado.meses[k] = estado.meses[k] || {gastos:[]};
      estado.meses[k].limite = lim;
      // guardamos el saldo del inicio del mes: lo de ahora + lo ya gastado
      estado.meses[k].saldoInicial = Math.round((saldo + totalGastos(estado.meses[k]) - totalIngresos(estado.meses[k]) + sumaFijosCobrados(k))*100)/100;
      editandoLimite = false;
      render(); await guardar();
    };
    document.getElementById('guardar-lim').onclick = ok;
    const c = document.getElementById('cancelar'); if(c) c.onclick = ()=>{ editandoLimite=false; editMov=null; render(); };
    ['saldo','lim'].forEach(id=>document.getElementById(id).onkeydown = e=>{ if(e.key==='Enter') ok(); });
    return;
  }

  if(!mes.ingresos) mes.ingresos = [];
  const total = totalGastos(mes);
  const ingresos = totalIngresos(mes);
  const extra = extraLimite(mes);
  const limEf = mes.limite + extra;
  const queda = limEf - total;
  const kMes = claveMes(vista.y,vista.m);
  const fijos = fijosDelMes(kMes);
  const fijosTotal = sumaFijos(kMes);
  const fijosCobr = sumaFijosCobrados(kMes);
  const saldoActual = mes.saldoInicial + ingresos - total - fijosCobr;
  const saldoFinalPrevisto = mes.saldoInicial + ingresos - Math.max(total, limEf) - fijosTotal;
  const nDias = diasEnMes(vista.y,vista.m);
  const esActual = vista.y===hoy.getFullYear() && vista.m===hoy.getMonth();
  const esPasado = new Date(vista.y,vista.m+1,1) <= new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const diaHoy = esActual ? hoy.getDate() : (esPasado ? nDias : 0);
  const diasRestantes = esActual ? nDias - hoy.getDate() + 1 : (esPasado ? 0 : nDias);
  const pct = Math.min(100, Math.max(0, total/limEf*100));
  const ritmoPct = diaHoy/nDias*100;
  const gastadoHoy = mes.gastos.filter(g=>g.fecha===isoHoy).reduce((s,g)=>s+g.importe,0);
  const color = total>limEf ? 'var(--bad)' : (pct>ritmoPct+5 ? 'var(--warn)' : 'var(--good)');

  let diario;
  if(esPasado && !esActual){
    diario = queda>=0
      ? `<div class="diario"><p class="grande num">Ahorraste ${fmt(queda)}</p><p class="sub">Cerraste el mes por debajo de tu límite.</p></div>`
      : `<div class="diario mal"><p class="grande num">Te pasaste ${fmt(-queda)}</p><p class="sub">Gastaste más de lo previsto este mes.</p></div>`;
  } else if(queda<0){
    diario = `<div class="diario mal"><p class="grande num">Te has pasado ${fmt(-queda)}</p><p class="sub">Intenta no gastar más hasta que acabe el mes.</p></div>`;
  } else {
    const porDiaPerm = queda/diasRestantes;
    diario = `<div class="diario"><p class="grande num">${fmt(porDiaPerm)} al día</p>
      <p class="sub">es lo que puedes gastar durante ${diasRestantes===1?'el último día':`los ${diasRestantes} días que quedan`}${esActual?` · hoy llevas ${fmt(gastadoHoy)}`:''}</p></div>`;
  }

  // agrupar movimientos por día
  const movs = [...mes.gastos.map(g=>({...g,tipo:'gasto'})), ...mes.ingresos.map(g=>({...g,tipo:'ingreso'}))];
  const porDia = {};
  movs.forEach(g=>{ (porDia[g.fecha] = porDia[g.fecha] || []).push(g); });
  const fechas = Object.keys(porDia).sort().reverse();
  const orden = [];
  const listado = fechas.length ? fechas.map(f=>{
    const d = new Date(f+'T12:00:00');
    const etiqueta = f===isoHoy ? 'Hoy' : d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric'});
    const gastoDia = porDia[f].filter(g=>g.tipo==='gasto').reduce((s,g)=>s+g.importe,0);
    return `<div class="dia"><div class="dia-cab"><span style="text-transform:capitalize">${etiqueta}</span><span class="num">${gastoDia>0?'Gastado '+fmt(gastoDia):''}</span></div>
      ${porDia[f].map(g=>{ orden.push(g); return `<div class="gasto ${g.tipo} ${editMov && editMov.id===g.id?'editando':''}" data-id="${g.id}" data-tipo="${g.tipo}" role="button" tabindex="0" aria-label="Modificar movimiento"><span class="concepto"></span><span class="imp num">${g.tipo==='ingreso'?'+':''}${fmt(g.importe)}</span>
      <button class="borrar" data-id="${g.id}" data-tipo="${g.tipo}" aria-label="Borrar ${g.tipo}">×</button></div>`; }).join('')}</div>`;
  }).join('') : '<p class="vacio">Aún no has apuntado ningún movimiento este mes. Empieza con el primero arriba.</p>';

  const minF = `${vista.y}-${pad(vista.m+1)}-01`, maxF = `${vista.y}-${pad(vista.m+1)}-${pad(nDias)}`;
  const fechaDef = esActual ? isoHoy : minF;
  const esIngreso = tipoMov==='ingreso';

  app.innerHTML = `
    <div class="hero">
      <p class="quedan">${queda>=0?'Te quedan':'Vas por encima'}</p>
      <p class="cifra num ${queda<0?'negativo':''}">${fmt(Math.abs(queda))}</p>
      <p class="de">de ${fmt(limEf)}${extra>0?` (${fmt(mes.limite)} + ${fmt(extra)} extra)`:''} · <button id="editar">editar</button></p>
      <div class="barra" role="img" aria-label="Gastado ${Math.round(pct)}% del límite">
        <div class="lleno" style="width:${pct}%;background:${color}"></div>
        ${esActual?`<div class="ritmo" style="left:${ritmoPct}%" title="Dónde deberías ir hoy"></div>`:''}
      </div>
      <div class="leyenda"><span>Gastado ${fmt(total)}</span>${esActual?'<span>La línea marca dónde deberías ir hoy</span>':''}</div>
      ${diario}
      <div class="banco">
        <div><p class="etq">En el banco</p><p class="valor num ${saldoActual<0?'negativo':''}">${fmt(saldoActual)}</p></div>
        <div><p class="etq">${esPasado && !esActual ? 'Al cerrar el mes' : 'Si cumples tu máximo, acabarás con'}</p><p class="valor num">${fmt(esPasado && !esActual ? saldoActual : saldoFinalPrevisto)}</p></div>
      </div>
      ${(ingresos>0 || fijosTotal-fijosCobr>0)?`<p class="nota-ingresos">${[ingresos>0?`Este mes han entrado ${fmt(ingresos)}.`:'', fijosTotal-fijosCobr>0?`Quedan ${fmt(fijosTotal-fijosCobr)} de pagos fijos por cobrar.`:''].filter(Boolean).join(' ')}</p>`:''}
      <button class="ajustar" id="ajustar">El banco me dice otra cantidad</button>
    </div>

    <section id="form-mov">
      ${editMov?'<p class="editando-aviso">Modificando un movimiento</p>':''}
      <div class="selector" role="tablist">
        <button role="tab" aria-selected="${!esIngreso}" data-tipo="gasto" class="${!esIngreso?'activo':''}">Gasto</button>
        <button role="tab" aria-selected="${esIngreso}" data-tipo="ingreso" class="${esIngreso?'activo':''}">Ingreso</button>
      </div>
      <div class="form">
        <label>Importe (€)<input id="g-imp" class="importe" type="text" inputmode="decimal" placeholder="0,00"></label>
        <label>Fecha<input id="g-fecha" type="date" value="${fechaDef}" min="${minF}" max="${maxF}"></label>
        <label class="ancho">Concepto<input id="g-con" type="text" maxlength="60" placeholder="${esIngreso?'Nómina, bizum, devolución…':'Supermercado, cena, gasolina…'}"></label>
        ${esIngreso?`<label class="ancho check"><input id="g-lim" type="checkbox"> <span>Sumarlo también a lo que puedo gastar este mes</span></label>`:''}
        <p class="error" id="g-err"></p>
        ${editMov ? `<button class="secundario-btn" id="g-cancel">Cancelar</button>
        <button class="primario mitad ${esIngreso?'verde':''}" id="g-add">Guardar cambios</button>`
        : `<button class="primario ${esIngreso?'verde':''}" id="g-add">${esIngreso?'Añadir ingreso':'Añadir gasto'}</button>`}
      </div>
    </section>

    <section>
      <h2>Pagos con Apple Pay</h2>
      <p class="copia-nota">Trae los pagos que el atajo ha ido apuntando. Puedes importar el mismo archivo todas las veces que quieras: los pagos repetidos no se duplican.</p>
      <div class="copia">
        <label>Importar pagos de Apple Pay<input type="file" id="importar-ap" accept=".txt,text/plain"></label>
      </div>
    </section>

    <section>
      <div class="cab-seccion"><h2>Pagos fijos de este mes</h2>${fijos.length?`<span class="num total-fijos">${fmt(fijosTotal)}</span>`:''}</div>
      <p class="copia-nota">Se descuentan de tu dinero en el banco, pero no de lo que puedes gastar al día.</p>
      ${fijos.length ? fijos.map(f=>`<div class="fijo ${cobrado(f)?'hecho':''}">
          <div class="fijo-dia num"><span>${f.diaReal}</span></div>
          <div class="fijo-info"><span class="fijo-nombre"></span><span class="fijo-sub">${cobrado(f)?'Cobrado':'Pendiente'}${f.cuotas===1?' · pago único':f.cuotas?` · cuota ${f.numCuota} de ${f.cuotas}`:' · todos los meses'}</span></div>
          <span class="imp num">${fmt(f.importe)}</span>
          <button class="borrar quitar-fijo" data-id="${f.id}" aria-label="Quitar pago fijo">×</button>
        </div>`).join('') : '<p class="vacio">No tienes pagos fijos este mes.</p>'}
      ${fijoFormAbierto ? `<div class="form fijo-form">
          <label class="ancho">Nombre<input id="f-nom" type="text" maxlength="40" placeholder="Letra del coche, gimnasio…"></label>
          <label>Importe (€)<input id="f-imp" class="importe" type="text" inputmode="decimal" placeholder="0,00"></label>
          <label>Día de cobro<input id="f-dia" type="text" inputmode="numeric" placeholder="3"></label>
          <label class="ancho">Número de cuotas (vacío si es todos los meses)<input id="f-cuo" type="text" inputmode="numeric" placeholder="Todos los meses"></label>
          <p class="error" id="f-err"></p>
          <button class="secundario-btn" id="f-cancel">Cancelar</button>
          <button class="primario mitad" id="f-add">Guardar pago fijo</button>
        </div>
        <p class="copia-nota">Empezará a cobrarse en ${nombreMes(vista.y,vista.m).toLowerCase()}.</p>`
        : `<button class="ajustar" id="f-abrir">Añadir un pago fijo</button>`}
    </section>

    <section>
      <h2>Gasto por día</h2>
      <div class="grafico">${grafico(mes, nDias, limEf)}</div>
    </section>

    <section>
      <h2>Movimientos</h2>
      ${fechas.length?'<p class="pista">Toca un movimiento para modificarlo.</p>':''}
      ${listado}
    </section>`;

  // conceptos con textContent (evita inyectar HTML)
  const conceptos = app.querySelectorAll('.gasto .concepto');
  orden.forEach((g,k)=>{ conceptos[k].textContent = (g.concepto || (g.tipo==='ingreso'?'Ingreso':'Sin concepto')) + (g.alLimite?' · suma al máximo':'') + (g.origen==='applepay'?' · Apple Pay':''); });

  app.querySelectorAll('.selector button').forEach(b=>b.onclick = ()=>{
    const imp = document.getElementById('g-imp').value, con = document.getElementById('g-con').value, fe = document.getElementById('g-fecha').value;
    tipoMov = b.dataset.tipo; render();
    document.getElementById('g-imp').dataset.relleno = '1';
    document.getElementById('g-imp').value = imp; document.getElementById('g-con').value = con; document.getElementById('g-fecha').value = fe;
  });
  document.getElementById('editar').onclick = ()=>{ editandoLimite = true; render(); };
  document.getElementById('ajustar').onclick = async ()=>{
    const r = prompt('¿Cuánto te aparece ahora en el banco? (€)', String(Math.round(saldoActual*100)/100).replace('.',','));
    if(r===null) return;
    const v = num(r);
    if(isNaN(v)){ alert('Escribe solo la cantidad, por ejemplo 1234,56'); return; }
    mes.saldoInicial = Math.round((v + total - ingresos + fijosCobr)*100)/100;
    render(); await guardar();
  };
  // Rellenar el formulario si estamos modificando
  const movEditado = editMov ? (editMov.tipo==='ingreso'?mes.ingresos:mes.gastos).find(g=>g.id===editMov.id) : null;
  if(editMov && !movEditado) editMov = null;
  if(movEditado && !document.getElementById('g-imp').dataset.relleno){
    document.getElementById('g-imp').value = movEditado.importe.toFixed(2).replace('.',',');
    document.getElementById('g-con').value = movEditado.concepto || '';
    document.getElementById('g-fecha').value = movEditado.fecha;
    const chk = document.getElementById('g-lim'); if(chk) chk.checked = !!movEditado.alLimite;
  }
  document.getElementById('importar-ap').onchange = async e=>{
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    const aviso = document.getElementById('aviso');
    try{
      const r = importarApplePay(await f.text());
      render(); await guardar();
      let msg = r.nuevos ? `Importados ${r.nuevos} pago${r.nuevos===1?'':'s'} nuevo${r.nuevos===1?'':'s'}.` : 'No había pagos nuevos.';
      if(r.malos) msg += ` ${r.malos} línea${r.malos===1?'':'s'} no se pudo leer.`;
      alert(msg);
      aviso.textContent = '';
    }catch(err){
      alert('No se pudo leer ese archivo.');
    }
  };
  const gc = document.getElementById('g-cancel');
  if(gc) gc.onclick = ()=>{ editMov = null; render(); };
  app.querySelectorAll('.gasto[data-id]').forEach(row=>{
    const abrirEdicion = ()=>{
      editMov = {id: row.dataset.id, tipo: row.dataset.tipo};
      tipoMov = row.dataset.tipo;
      render();
      document.getElementById('form-mov').scrollIntoView({behavior:'smooth', block:'start'});
    };
    row.onclick = e=>{ if(e.target.closest('.borrar')) return; abrirEdicion(); };
    row.onkeydown = e=>{ if((e.key==='Enter'||e.key===' ') && !e.target.closest('.borrar')){ e.preventDefault(); abrirEdicion(); } };
  });
  const add = async ()=>{
    const imp = num(document.getElementById('g-imp').value);
    const fecha = document.getElementById('g-fecha').value;
    const err = document.getElementById('g-err');
    if(!(imp>0)){ err.textContent = 'Escribe un importe mayor que cero.'; return; }
    if(!fecha || fecha<minF || fecha>maxF){ err.textContent = 'Elige una fecha de este mes.'; return; }
    const mov = {id: editMov ? editMov.id : nuevoId(), importe: imp, concepto: document.getElementById('g-con').value.trim(), fecha};
    if(tipoMov==='ingreso') mov.alLimite = document.getElementById('g-lim').checked;
    const eraEdicion = !!editMov;
    if(editMov){
      // quitar la versión anterior (puede haber cambiado de gasto a ingreso o al revés)
      if(editMov.tipo==='ingreso') mes.ingresos = mes.ingresos.filter(g=>g.id!==editMov.id);
      else mes.gastos = mes.gastos.filter(g=>g.id!==editMov.id);
      editMov = null;
    }
    if(tipoMov==='ingreso') mes.ingresos.push(mov); else mes.gastos.push(mov);
    render(); await guardar();
    if(!eraEdicion) document.getElementById('g-imp').focus();
  };
  document.getElementById('g-add').onclick = add;
  ['g-imp','g-con'].forEach(id=>document.getElementById(id).onkeydown = e=>{ if(e.key==='Enter') add(); });
  // nombres de pagos fijos con textContent
  app.querySelectorAll('.fijo-nombre').forEach((el,k)=>{ el.textContent = fijos[k].nombre; });
  const abrir = document.getElementById('f-abrir');
  if(abrir) abrir.onclick = ()=>{ fijoFormAbierto = true; render(); document.getElementById('f-nom').focus(); };
  const cancelar = document.getElementById('f-cancel');
  if(cancelar) cancelar.onclick = ()=>{ fijoFormAbierto = false; render(); };
  const fAdd = document.getElementById('f-add');
  if(fAdd) fAdd.onclick = async ()=>{
    const nombre = document.getElementById('f-nom').value.trim();
    const imp = num(document.getElementById('f-imp').value);
    const dia = parseInt(document.getElementById('f-dia').value,10);
    const cuoTxt = document.getElementById('f-cuo').value.trim();
    const cuotas = cuoTxt ? parseInt(cuoTxt,10) : null;
    const err = document.getElementById('f-err');
    if(!nombre){ err.textContent = 'Ponle un nombre al pago.'; return; }
    if(!(imp>0)){ err.textContent = 'Escribe un importe mayor que cero.'; return; }
    if(!(dia>=1 && dia<=31)){ err.textContent = 'El día de cobro tiene que estar entre 1 y 31.'; return; }
    if(cuoTxt && !(cuotas>=1)){ err.textContent = 'El número de cuotas tiene que ser 1 o más, o déjalo vacío.'; return; }
    estado.fijos = estado.fijos || [];
    estado.fijos.push({id: nuevoId(), nombre, importe: imp, dia, desde: kMes, cuotas});
    fijoFormAbierto = false;
    render(); await guardar();
  };
  app.querySelectorAll('.quitar-fijo').forEach(b=>b.onclick = async ()=>{
    const f = estado.fijos.find(x=>x.id===b.dataset.id);
    if(!f) return;
    if(idxMes(f.desde) >= idxMes(kMes)){
      if(!confirm(`¿Quitar «${f.nombre}»? Se borrará por completo.`)) return;
      estado.fijos = estado.fijos.filter(x=>x.id!==f.id);
    } else {
      if(!confirm(`¿Dejar de contar «${f.nombre}» desde ${nombreMes(vista.y,vista.m).toLowerCase()}? Los meses anteriores no cambian.`)) return;
      const prev = new Date(vista.y, vista.m-1, 1);
      f.hasta = claveMes(prev.getFullYear(), prev.getMonth());
    }
    render(); await guardar();
  });
  app.querySelectorAll('.borrar:not(.quitar-fijo)').forEach(b=>b.onclick = async ()=>{
    if(editMov && editMov.id===b.dataset.id) editMov = null;
    if(b.dataset.tipo==='ingreso') mes.ingresos = mes.ingresos.filter(g=>g.id!==b.dataset.id);
    else mes.gastos = mes.gastos.filter(g=>g.id!==b.dataset.id);
    render(); await guardar();
  });
}

function grafico(mes, nDias, limEf){
  const sumas = Array(nDias).fill(0);
  mes.gastos.forEach(g=>{ const d = parseInt(g.fecha.slice(8,10),10); if(d>=1&&d<=nDias) sumas[d-1]+=g.importe; });
  const media = limEf/nDias;
  const max = Math.max(media*1.6, ...sumas);
  const W=360, H=140, top=10, base=H-22, bw=W/nDias;
  const y = v => base - (v/max)*(base-top);
  const esActual = vista.y===hoy.getFullYear() && vista.m===hoy.getMonth();
  let barras = '';
  sumas.forEach((v,i)=>{
    const h = base - y(v);
    const c = v>media ? 'var(--warn)' : 'var(--good)';
    const esHoy = esActual && i===hoy.getDate()-1;
    if(v>0) barras += `<rect x="${i*bw+1}" y="${y(v)}" width="${bw-2}" height="${h}" rx="2" fill="${c}"><title>Día ${i+1}: ${fmt(v)}</title></rect>`;
    if(esHoy) barras += `<rect x="${i*bw+0.5}" y="${top}" width="${bw-1}" height="${base-top}" fill="none" stroke="var(--accent)" stroke-dasharray="2 2" rx="2"/>`;
    if((i+1)%5===0 || i===0) barras += `<text x="${i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto diario del mes frente a la media permitida">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>
    ${barras}
    <line x1="0" x2="${W}" y1="${y(media)}" y2="${y(media)}" stroke="var(--ink)" stroke-opacity=".5" stroke-dasharray="4 3"/>
    <text x="${W-2}" y="${y(media)-4}" text-anchor="end" font-size="9" fill="var(--muted)">media permitida ${fmt(media)}/día</text>
  </svg>`;
}

document.getElementById('prev').onclick = ()=>{
  if(vista.y*12+vista.m <= INICIO.y*12+INICIO.m) return;
  vista.m--; if(vista.m<0){vista.m=11;vista.y--;} editandoLimite=false; editMov=null; render();
};
document.getElementById('next').onclick = ()=>{ vista.m++; if(vista.m>11){vista.m=0;vista.y++;} editandoLimite=false; editMov=null; render(); };

// Arranque: primero copia local, luego base de datos privada si está disponible
try{ const raw = localStorage.getItem(LS_KEY); if(raw) estado = JSON.parse(raw); }catch(e){}
if(!estado.meses) estado = {meses:{}};
if(!estado.fijos){
  estado.fijos = [
    {id:'coche', nombre:'Letra del coche', importe:325.76, dia:3, desde:'2026-11', cuotas:null},
    {id:'pc', nombre:'PC nuevo', importe:354.25, dia:3, desde:'2026-11', cuotas:9},
    {id:'ipad', nombre:'iPad (última cuota)', importe:175, dia:26, desde:'2026-11', cuotas:1}
  ];
  try{ localStorage.setItem(LS_KEY, JSON.stringify(estado)); }catch(e){}
}
render();

// Pedir almacenamiento persistente para que iOS no borre los datos
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

// Copia de seguridad
document.getElementById('exportar').onclick = async ()=>{
  const nombre = `presupuesto-${isoHoy}.json`;
  const blob = new Blob([JSON.stringify(estado,null,2)],{type:'application/json'});
  const file = new File([blob], nombre, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Copia de mi presupuesto'});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};
document.getElementById('importar').onchange = async e=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  const aviso = document.getElementById('aviso');
  try{
    const datos = JSON.parse(await f.text());
    if(!datos || typeof datos.meses!=='object') throw 0;
    if(!confirm('Esto sustituirá los datos actuales por los de la copia. ¿Continuar?')) return;
    estado = datos; editandoLimite = false;
    render(); await guardar();
    aviso.textContent = 'Copia restaurada.';
  }catch(err){
    aviso.textContent = 'Ese archivo no es una copia válida de esta app.';
  }
};

// Modo sin conexión
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
