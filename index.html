<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi presupuesto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#16232E; --muted:#5D6B78;
  --line:#D5DDE4; --good:#1F8A70; --goodsoft:#D6EFE7; --warn:#C8811A; --bad:#C2413B; --badsoft:#F6DCDA;
  --accent:#23507A; --track:#DCE3EA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1720; --surface:#17222D; --ink:#E7EEF4; --muted:#93A3B2;
    --line:#2A3846; --good:#4CC39E; --goodsoft:#173A31; --warn:#E3A44A; --bad:#EE7A73; --badsoft:#3E2222;
    --accent:#8DB8E0; --track:#24313E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1720; --surface:#17222D; --ink:#E7EEF4; --muted:#93A3B2;
  --line:#2A3846; --good:#4CC39E; --goodsoft:#173A31; --warn:#E3A44A; --bad:#EE7A73; --badsoft:#3E2222;
  --accent:#8DB8E0; --track:#24313E;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px))}
.num{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mes h1{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:1.05rem;font-weight:600;margin:0}
.flecha{background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:1.1rem;color:var(--muted)}

.hero{padding:6px 0 22px}
.hero .quedan{font-size:.95rem;color:var(--muted);margin:0}
.hero .cifra{font-size:clamp(3.4rem,17vw,5rem);font-weight:800;line-height:1;letter-spacing:-.035em;margin:4px 0 8px}
.hero .cifra .dec{font-size:.42em;font-weight:700;letter-spacing:0;margin-left:2px}
.hero .cifra.negativo{color:var(--bad)}
.hero .de{color:var(--muted);margin:0 0 18px}
.hero .de button{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px}

.barra{position:relative;height:18px;background:var(--track);border-radius:9px;overflow:visible}
.barra .lleno{height:100%;border-radius:9px;background:var(--good);transition:width .4s ease}
.barra .ritmo{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:8px}

.diario{margin-top:20px;padding:16px 18px;border-radius:14px;background:var(--goodsoft)}
.diario.mal{background:var(--badsoft)}
.diario .etq-diario{font-size:.9rem;color:var(--muted);margin:0 0 2px}
.diario .grande.negativo{color:var(--bad)}
.diario p{margin:0}
.diario .grande{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.diario .sub{font-size:.9rem;color:var(--muted);margin-top:2px}

section{margin-top:30px}
h2{font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;font-size:1rem;font-weight:600;margin:0 0 12px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:4px}
.form .ancho{grid-column:1/-1}
.form input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;width:100%;min-width:0}
.form input.importe{font-weight:700;font-size:1.5rem;font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif}
.primario{grid-column:1/-1;background:var(--accent);color:var(--surface);border:none;border-radius:10px;padding:14px;font-weight:600;font-size:1rem}
.error{grid-column:1/-1;color:var(--bad);font-size:.88rem;margin:0;min-height:0}

.grafico{overflow-x:auto}
.grafico svg{display:block;width:100%;height:auto;min-width:300px}

.dia{margin-bottom:18px}
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;gap:10px}
.dia-nombre{font-weight:600;font-size:.92rem;flex:1;min-width:0}
.dia-total{font-weight:700;font-size:.95rem;color:var(--muted);white-space:nowrap}
.dia-lista{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gasto{display:flex;align-items:center;gap:12px;padding:13px 16px 13px 14px;border-top:1px solid var(--line)}
.gasto:first-child{border-top:none}
.gasto .avatar{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;background:var(--track);color:var(--accent)}
.gasto.ingreso .avatar{background:var(--goodsoft);color:var(--good);font-size:1.3rem}
.gasto .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gasto .concepto{font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gasto .meta{font-size:.8rem;color:var(--muted);line-height:1.3}
.gasto .imp{font-size:1.15rem;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.gasto .borrar{width:30px;height:30px;font-size:1.1rem;flex:none}
.borrar{background:none;border:none;color:var(--muted);font-size:1.2rem;width:32px;height:32px;border-radius:8px}
.borrar:hover{background:var(--track)}
.vacio{color:var(--muted);margin:0}

.config{padding:30px 0}
.config p{color:var(--muted);margin:0 0 14px}
.config .fila{display:flex;gap:10px}
.config input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:1.4rem;font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif}
.config .campo{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);margin-bottom:14px}
.config .campo input{flex:none;width:100%}
.config .fila button{flex:1;padding:14px 20px}
.config .secundario{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.banco{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.banco > div{display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.banco .etq{font-size:.82rem;color:var(--muted);margin:0;line-height:1.3}
.banco .valor{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
.banco .valor.negativo{color:var(--bad)}
.ajustar{background:none;border:none;color:var(--accent);padding:10px 0 0;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.config button{background:var(--accent);color:var(--surface);border:none;border-radius:10px;padding:0 20px;font-weight:600}
.selector{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;margin-bottom:14px}
.selector button{border:none;background:none;padding:8px 18px;border-radius:8px;font-weight:600;color:var(--muted)}
.selector button.activo{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.form .check{flex-direction:row;align-items:center;gap:10px;font-size:.92rem;color:var(--ink)}
.form .check input{width:22px;height:22px;flex:none;accent-color:var(--good)}
.primario.verde{background:var(--good)}
.gasto.ingreso .imp{color:var(--good)}
.nota-ingresos{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.cab-seccion{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cab-seccion h2{margin-bottom:4px}
.total-fijos{font-weight:800;font-size:1.15rem}
.fijo{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fijo-dia{width:40px;height:40px;flex:none;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600}
.fijo.hecho .fijo-dia{background:var(--goodsoft);border-color:transparent;color:var(--good)}
.fijo-info{flex:1;min-width:0;display:flex;flex-direction:column}
.fijo-nombre{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fijo-sub{font-size:.82rem;color:var(--muted)}
.fijo.hecho .imp{color:var(--muted)}
.fijo .imp{font-weight:700;font-size:1.1rem}
.fijo-form{margin-top:14px}
.secundario-btn{background:var(--surface);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:14px;font-weight:600}
.primario.mitad{grid-column:auto}
.peligro{grid-column:1/-1;background:none;border:none;color:var(--bad);font-weight:600;padding:10px}
.gasto[data-id]{cursor:pointer}
.gasto[data-id]:active{background:var(--track)}
.gasto.editando{background:var(--track);box-shadow:inset 4px 0 0 var(--accent)}
.editando-aviso{font-size:.88rem;font-weight:600;color:var(--accent);margin:0 0 8px}
.pista{font-size:.82rem;color:var(--muted);margin:-6px 0 10px}
.copia{display:flex;gap:10px;flex-wrap:wrap}
.copia button,.copia label{flex:1;min-width:140px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:600;color:var(--accent);cursor:pointer}
.copia input{display:none}
.copia-nota{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.aviso{font-size:.8rem;color:var(--muted);margin-top:36px;text-align:center}
/* v5 */
.barra{overflow:hidden}
.barra .lleno{position:absolute;top:0;bottom:0;border-radius:0 9px 9px 0}
.barra .reservado{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.55}
.barra .ritmo{top:0;bottom:0;width:3px;opacity:.7}
.muestra{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 4px)}
.acciones-hero{display:flex;flex-wrap:wrap;gap:0 18px}
.aviso-copia{background:var(--surface);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.aviso-copia p{margin:0;font-size:.9rem}
.aviso-copia button{align-self:flex-start;background:var(--warn);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:600}
.recomendado{margin:-4px 0 16px}
.rec{background:var(--goodsoft);border-radius:14px;padding:14px 16px}
.rec.mal{background:var(--badsoft)}
.config .rec p{margin:0;color:var(--ink)}
.rec .rec-etq{font-size:.85rem;color:var(--muted) !important}
.rec .rec-cifra{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.rec-desglose{margin:8px 0 4px;font-size:.85rem;color:var(--muted)}
.rec-desglose div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.config .rec .rec-nota{font-size:.85rem;color:var(--muted);margin-top:6px}
.config .usar-rec{margin-top:10px;padding:10px 16px}
.res-tabla{margin-top:10px;border-top:1px solid rgba(127,127,127,.25)}
.res-fila{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(127,127,127,.25);font-size:.9rem}
.res-fila span:first-child{color:var(--muted)}
.res-fila span:last-child{text-align:right;font-weight:600}
.txt-bien{color:var(--good)} .txt-mal{color:var(--bad)}
.diario.resumen .grande{font-size:1.6rem}
.filtros{display:flex;gap:8px;margin-bottom:12px}
.filtros input,.filtros select,.form select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);min-width:0}
.filtros input{flex:1}
.filtros select{flex:0 1 46%}
.form select{width:100%;padding:12px}
.enlace{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit}
.subtitulo{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 2px}
.fijo[data-fid],.fijo[data-pid]{cursor:pointer;border-radius:8px}
.fijo[data-fid]:active,.fijo[data-pid]:active{background:var(--track)}
.fijo.editando{background:var(--track);box-shadow:inset 4px 0 0 var(--accent);padding-left:8px}
.fijo.ingreso .imp{color:var(--good)}
.fijo.ingreso .fijo-dia{color:var(--good)}
.gasto .avatar{font-size:1.25rem}
.nota-credito{font-size:.85rem;font-weight:600;color:var(--accent);background:var(--track);border-radius:8px;padding:6px 10px;margin:2px 0 10px;display:inline-block}
.etq-credito{display:inline-block;align-self:flex-start;margin-top:4px;font-size:.75rem;font-weight:600;color:var(--accent);background:var(--track);border-radius:6px;padding:2px 7px}
.gasto .imp.credito,.fijo.con-credito .imp{color:var(--muted)}
.cats{display:flex;flex-direction:column;gap:6px}
.cat-fila{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.cat-emoji{font-size:1.4rem;width:32px;text-align:center;flex:none}
.cat-cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cat-cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat-nombre{font-weight:600}
.cat-imp{font-weight:800;font-size:1.05rem;white-space:nowrap}
.cat-barra{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.cat-barra span{display:block;height:100%;background:var(--accent);border-radius:3px}
.cat-pct{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.barra .lleno{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mes">
    <button class="flecha" id="prev" aria-label="Mes anterior">‹</button>
    <h1 id="titulo-mes"></h1>
    <button class="flecha" id="next" aria-label="Mes siguiente">›</button>
  </div>
  <div id="app"><p class="vacio">Cargando…</p></div>
  <section>
    <h2>Copia de seguridad</h2>
    <p class="copia-nota">Tus datos se guardan solo en este iPhone. Haz una copia de vez en cuando y guárdala en Archivos o iCloud Drive. <span id="ultima-copia"></span></p>
    <div class="copia">
      <button id="exportar">Guardar copia</button>
      <label>Restaurar copia<input type="file" id="importar" accept="application/json,.json"></label>
    </div>
  </section>
  <section>
    <h2>Exportar a Excel</h2>
    <p class="copia-nota">Descarga tus movimientos, pagos fijos y gastos programados en un archivo que se abre con Excel o Numbers.</p>
    <div class="copia">
      <button id="csv-mes">Este mes</button>
      <button id="csv-todo">Todos los meses</button>
    </div>
  </section>
  <p class="aviso" id="aviso"></p>
</main>

<script>
const partesImporte = n => { const neg = n < 0; const [e,d] = Math.abs(n).toFixed(2).split('.'); return {neg, ent: e.replace(/\B(?=(\d{3})+(?!\d))/g,'.'), dec: d}; };
const fmt = n => { const p = partesImporte(n); return `${p.neg?'−':''}${p.ent},${p.dec}\u00a0€`; };
// Versión destacada: euros grandes y céntimos más pequeños
const fmtGrande = n => { const p = partesImporte(n); return `${p.neg?'−':''}${p.ent}<span class="dec">,${p.dec}\u00a0€</span>`; };
const hoy = new Date();
const pad = n => String(n).padStart(2,'0');
const isoHoy = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;
const INICIO = {y:2026, m:10}; // noviembre 2026 (m 0-11)
let vista = {y:hoy.getFullYear(), m:hoy.getMonth()};
if(vista.y*12+vista.m < INICIO.y*12+INICIO.m) vista = {...INICIO};
let estado = {meses:{}};
let editandoLimite = false;
const LS_KEY = 'presupuesto-v1';

const claveMes = (y,m) => `${y}-${pad(m+1)}`;
const diasEnMes = (y,m) => new Date(y,m+1,0).getDate();
const nombreMes = (y,m) => { const t = new Date(y,m,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); };
const mesActual = () => estado.meses[claveMes(vista.y,vista.m)];

const num = v => { const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n) ? NaN : Math.round(n*100)/100; };
const totalGastos = mes => mes.gastos.reduce((s,g)=>s+g.importe,0);
const totalIngresos = mes => (mes.ingresos||[]).reduce((s,g)=>s+g.importe,0);
const extraLimite = mes => (mes.ingresos||[]).filter(g=>g.alLimite).reduce((s,g)=>s+g.importe,0);
const nuevoId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tipoMov = 'gasto';
let fijoFormAbierto = false;
// ---- Importar pagos de Apple Pay (archivo creado por el atajo) ----
function parseImporteSimple(x){
  x = String(x).replace(/[^\d,.\-−]/g,'').replace('−','-');
  const neg = x.startsWith('-'); x = x.replace(/-/g,'');
  const c = x.lastIndexOf(','), d = x.lastIndexOf('.');
  if(c>=0 && d>=0){ x = c>d ? x.replace(/\./g,'').replace(',','.') : x.replace(/,/g,''); }
  else if(c>=0){ x = x.replace(/,/g,(m,i)=> i===c ? '.' : ''); }
  else if(d>=0 && /^\d{1,3}(\.\d{3})+$/.test(x)){ x = x.replace(/\./g,''); }
  const n = parseFloat(x);
  return isNaN(n) ? NaN : Math.round((neg?-n:n)*100)/100;
}
function parseImporte(t){
  t = String(t);
  // Si el texto lleva más cosas, buscamos la cantidad junto al símbolo €
  const m = t.match(/([-−]?\s?\d[\d.,\s]*?)\s?€/) || t.match(/€\s?([-−]?\s?\d[\d.,]*)/) || t.match(/([-−]?\d[\d.,]*)\s?EUR/i);
  if(m) return parseImporteSimple(m[1].replace(/\s/g,''));
  return parseImporteSimple(t);
}
// Los pagos del 30 y 31 de octubre de 2026 cuentan como 1 de noviembre (arranque de la app)
function ajustarFecha(f){ return (f==='2026-10-30' || f==='2026-10-31') ? '2026-11-01' : f; }
function parseFecha(t){
  t = String(t).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}
// Lee el texto de una captura de la ventana de compra de Apple (App Store / compras en apps)
function parseCaptura(txt){
  const lineas = txt.split(/\s*\|\s*/).map(l=>l.trim()).filter(Boolean);
  const dinero = /(\d{1,3}(?:\.\d{3})+,\d{2}|\d+,\d{2}|\d+\.\d{2})\s?€|€\s?(\d+[.,]\d{2})/;
  const edad = /\s*\(?\b\d{1,2}\s?\+\)?\s*$/;
  const ruido = /^(compras? en la app|app store|pulsa dos veces|para pagar|confirma con|cobro único|cuenta:|consulta los detalles|de \d+ días|suscripción|precio|\d{1,2}\s?\+)/i;
  // Ancla: "Compra dentro de la app" (compras dentro de apps) o la clasificación por edad junto al nombre de la app
  let iAncla = lineas.findIndex(l=>/compra dentro de la app/i.test(l));
  let iApp = -1;
  if(iAncla > 0){
    iApp = iAncla - 1;
    if(/^\d{1,2}\s?\+$/.test(lineas[iApp]) && iApp>0) iApp--; // "13+" en línea aparte
  } else {
    iApp = lineas.findIndex(l=>edad.test(l) && !/^\d{1,2}\s?\+$/.test(l));
    if(iApp < 0){ const iEdad = lineas.findIndex(l=>/^\d{1,2}\s?\+$/.test(l)); if(iEdad>0) iApp = iEdad-1; }
    iAncla = iApp;
  }
  let app = iApp>=0 ? lineas[iApp].replace(edad,'').trim() : '';
  let articulo = '';
  for(let k=iApp-1; k>=0 && iApp>=0; k--){ if(!ruido.test(lineas[k])){ articulo = lineas[k]; break; } }
  if(articulo && articulo===app) articulo = '';
  // Precio: el primero que aparece después del ancla (lo de arriba puede ser el fondo de la app)
  let importe = NaN;
  for(let k=Math.max(iAncla,0); k<lineas.length; k++){
    const m = lineas[k].match(dinero);
    if(m){ importe = parseImporteSimple(m[1]||m[2]); break; }
  }
  if(isNaN(importe)){ const m = txt.match(dinero); if(m) importe = parseImporteSimple(m[1]||m[2]); }
  // Tarjeta: la línea anterior a "•••• 1234"
  let tarjeta = '';
  const iNum = lineas.findIndex(l=>/[•·.*∙●]{2,}\s*\d{4}/.test(l));
  if(iNum>0) tarjeta = lineas[iNum-1].replace(/\s*(apple\s?pay|pay)\s*$/i,'').trim();
  else { const m = txt.match(/([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ ]{3,})\s*\|?\s*[•·.*∙●]{2,}\s*\d{4}/); if(m) tarjeta = m[1].trim(); }
  return {importe, app, articulo, tarjeta};
}

// Huella corta de cada línea importada (así no se guardan datos personales como el correo)
function huella(t){ let h1=0x811c9dc5, h2=0x1b873593; for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); h1=Math.imul(h1^c,16777619); h2=Math.imul(h2^c,2246822519); } return (h1>>>0).toString(36)+(h2>>>0).toString(36); }
function importarApplePay(texto){
  estado.importados = estado.importados || [];
  const vistos = new Set(estado.importados);
  let nuevos = 0, ignorados = 0, malos = 0, duplicados = 0;
  const VENTANA = 5*60*1000; // 5 minutos
  texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(linea=>{
    let partes = linea.split(';');
    // Líneas del atajo de capturas de compras: fecha;#CAPTURA;texto de la captura
    if(partes.length >= 3 && partes[1].trim()==='#CAPTURA'){
      const fecha = ajustarFecha(parseFecha(partes[0]));
      const info = parseCaptura(partes.slice(2).join(';'));
      if(!fecha || isNaN(info.importe) || info.importe<=0){ malos++; return; }
      // Clave nueva (#c2) para volver a revisar capturas que versiones anteriores descartaron por error
      const hl = huella(linea + '#c2'); if(vistos.has(hl)) return;
      vistos.add(hl); estado.importados.push(hl);
      const [y,mm] = fecha.split('-').map(Number);
      if(y*12+(mm-1) < INICIO.y*12+INICIO.m){ ignorados++; return; }
      const k = `${y}-${pad(mm)}`;
      estado.meses[k] = estado.meses[k] || {gastos:[]};
      const mesK = estado.meses[k];
      mesK.ingresos = mesK.ingresos || [];
      const hora = Date.parse(partes[0].trim().replace(' ','T')) || null;
      const concepto = [info.app, info.articulo].filter(Boolean).join(': ') || 'Compra sin detalle';
      // Huella del texto de la captura: dos capturas de la MISMA ventana dan el mismo texto;
      // dos compras distintas cambian algo (por ejemplo, las joyas de pago que tienes).
      const hOCR = huella(partes.slice(2).join(';').replace(/\s+/g,' ').trim());
      const mismoImporte = g => Math.abs(g.importe-info.importe) < 0.005;
      // Ya importada antes (misma hora exacta): no se vuelve a añadir
      if(hora && mesK.gastos.some(g => g.origen==='captura' && g.hora===hora && mismoImporte(g))) return;
      // Captura repetida de la misma ventana (texto idéntico en menos de 2 minutos)
      if(hora && mesK.gastos.some(g => g.origen==='captura' && g.hOCR===hOCR && mismoImporte(g) && Math.abs(g.hora-hora) <= 2*60*1000)){ duplicados++; return; }
      mesK.gastos.push({id: nuevoId(), importe: info.importe, concepto, fecha, origen:'captura', hora, tarjeta: info.tarjeta, hOCR});
      nuevos++;
      return;
    }
    // Las líneas del atajo de notificaciones de Cartera terminan en ;#N
    const esNotif = partes.length >= 3 && partes[partes.length-1].trim() === '#N';
    if(esNotif) partes = partes.slice(0,-1);
    // El atajo de Apple Pay puede añadir la tarjeta al final: ;#T:CREDITO SANTANDER
    let tarjetaAP = '';
    if(partes.length >= 3 && /^#T:/i.test(partes[partes.length-1].trim())){ tarjetaAP = partes[partes.length-1].trim().slice(3).trim(); partes = partes.slice(0,-1); }
    if(partes.length < 2){ if(!esNotif) malos++; return; }
    const fecha = ajustarFecha(parseFecha(partes[0]));
    const importe = parseImporte(partes[1]);
    let comercio = partes.slice(2).join(';').trim();
    // En los avisos de Cartera el título no dice dónde se compró: se deja para revisar
    if(esNotif && (!comercio || /^(cartera|wallet|apple\s*wallet)$/i.test(comercio))) comercio = '';
    if(!fecha || isNaN(importe) || importe===0){
      // avisos de Cartera sin importe (tarjeta añadida, etc.): se ignoran sin avisar
      if(!esNotif) malos++;
      return;
    }
    const hl = huella(/^2026-10-3[01]/.test(linea) ? linea+'#nov' : linea); if(vistos.has(hl)) return;
    vistos.add(hl); estado.importados.push(hl);
    const [y,mm] = fecha.split('-').map(Number);
    if(y*12+(mm-1) < INICIO.y*12+INICIO.m){ ignorados++; return; }
    const k = `${y}-${pad(mm)}`;
    estado.meses[k] = estado.meses[k] || {gastos:[]};
    const mesK = estado.meses[k];
    mesK.ingresos = mesK.ingresos || [];
    const origen = esNotif ? 'cartera' : 'applepay';
    const hora = Date.parse(partes[0].trim().replace(' ','T')) || null;
    // Un pago en tienda puede llegar por los dos atajos: si ya hay uno del otro atajo
    // con el mismo importe y a menos de 5 minutos, es el mismo pago.
    if(hora){
      const lista = importe < 0 ? mesK.ingresos : mesK.gastos;
      const repetido = lista.some(g => g.hora && (g.origen==='applepay'||g.origen==='cartera') && g.origen!==origen
        && Math.abs(g.importe - Math.abs(importe)) < 0.005 && Math.abs(g.hora - hora) <= VENTANA);
      if(repetido){ duplicados++; return; }
    }
    const mov = {id: nuevoId(), importe: Math.abs(importe), concepto: comercio || (esNotif?'Compra sin detalle (toca para ponerle nombre)':'Apple Pay'), fecha, origen, hora};
    if(tarjetaAP) mov.tarjeta = tarjetaAP;
    if(importe < 0){ mov.concepto = 'Devolución ' + (comercio||''); mov.alLimite = true; mesK.ingresos.push(mov); }
    else mesK.gastos.push(mov);
    nuevos++;
  });
  if(estado.importados.length > 3000) estado.importados = estado.importados.slice(-3000);
  return {nuevos, ignorados, malos, duplicados};
}

const r2 = n => Math.round(n*100)/100;
const suma = arr => arr.reduce((s,x)=>s+x.importe,0);
const fmtFecha = f => { const d = new Date(f+'T12:00:00'); return d.toLocaleDateString('es-ES',{day:'numeric',month:'long'}); };

// ---- Pagos e ingresos fijos ----
const idxMes = k => { const [y,m] = k.split('-').map(Number); return y*12 + (m-1); };
function fijosDelMes(k){
  const [y,m] = k.split('-').map(Number);
  const nDias = diasEnMes(y, m-1);
  return (estado.fijos||[]).filter(f=>{
    const n = idxMes(k) - idxMes(f.desde);
    if(n < 0) return false;
    if(f.cuotas && n >= f.cuotas) return false;
    if(f.hasta && idxMes(k) > idxMes(f.hasta)) return false;
    return true;
  }).map(f=>{
    const n = idxMes(k) - idxMes(f.desde);
    const dia = Math.min(f.dia, nDias);
    const ajustado = !!(f.ajustes && f.ajustes[k]!=null);
    return {...f, tipo: f.tipo||'gasto', importe: ajustado ? f.ajustes[k] : f.importe, ajustado,
      diaReal: dia, fecha: `${k}-${pad(dia)}`, numCuota: n+1};
  }).sort((a,b)=>a.diaReal-b.diaReal);
}
const cobrado = f => f.fecha <= isoHoy;
const progsDelMes = k => (estado.programados||[]).filter(p=>p.fecha.slice(0,7)===k).sort((a,b)=>a.fecha<b.fecha?-1:1);

// ---- Tarjeta de crédito: se cobra el primer lunes del mes siguiente ----
const esCredito = g => g.credito !== undefined ? !!g.credito : /cr[eé]dito/i.test(g.tarjeta||'');
function primerLunes(k){ const [y,m] = k.split('-').map(Number); const d = new Date(y, m-1, 1); while(d.getDay()!==1) d.setDate(d.getDate()+1); return `${k}-${pad(d.getDate())}`; }
const mesSiguiente = k => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m, 1); return claveMes(d.getFullYear(), d.getMonth()); };
const nombreCorto = k => { const [y,m] = k.split('-').map(Number); return nombreMes(y,m-1).split(' ')[0].toLowerCase(); };
function liquidacionCredito(k){
  const prevK = mesAnterior(k);
  const mp = estado.meses[prevK] || {gastos:[]};
  const tot = suma((mp.gastos||[]).filter(esCredito)) + suma(progsDelMes(prevK).filter(p=>p.credito));
  if(!tot) return null;
  return {id:'liq-'+prevK, concepto:`Tarjeta de crédito (compras de ${nombreCorto(prevK)})`, importe: r2(tot), fecha: primerLunes(k), enMaximo:true, auto:true};
}
// Gastos programados del mes, incluido el cargo automático de la tarjeta de crédito
const progsConLiq = k => { const l = liquidacionCredito(k); return [...(l?[l]:[]), ...progsDelMes(k).filter(p=>!p.credito)].sort((a,b)=>a.fecha<b.fecha?-1:1); };
const progsCredito = k => progsDelMes(k).filter(p=>p.credito);

// ---- Cálculo central de un mes ----
function calcMes(k){
  const mes = estado.meses[k];
  if(!mes || !mes.limite || typeof mes.saldoInicial!=='number') return null;
  mes.ingresos = mes.ingresos || [];
  const [y,m] = k.split('-').map(Number);
  const nDias = diasEnMes(y, m-1);
  const fijos = fijosDelMes(k);
  const fG = fijos.filter(f=>f.tipo!=='ingreso'), fI = fijos.filter(f=>f.tipo==='ingreso');
  const progs = progsConLiq(k);
  const progMax = suma(progs.filter(p=>p.enMaximo));
  const gastosDeb = mes.gastos.filter(g=>!esCredito(g)), gastosCred = mes.gastos.filter(esCredito);
  const progsCred = progsCredito(k);
  const total = suma(gastosDeb), totalCred = suma(gastosCred) + suma(progsCred);
  const ingresos = totalIngresos(mes), extra = extraLimite(mes);
  // Fijos marcados para el máximo: los pagos se reservan desde el día 1; los ingresos lo amplían
  const fGmax = suma(fG.filter(f=>f.enMaximo)), extraF = suma(fI.filter(f=>f.alLimite));
  const limEf = mes.limite + extra + extraF;
  const reserva = progMax + fGmax;
  const diario = limEf - reserva;            // presupuesto para el día a día
  const queda = diario - total;
  const fGtot = suma(fG), fItot = suma(fI), progTot = suma(progs);
  const fGcob = suma(fG.filter(cobrado)), fIcob = suma(fI.filter(cobrado)), progCob = suma(progs.filter(cobrado));
  const saldoActual = mes.saldoInicial + ingresos + fIcob - total - fGcob - progCob;
  const saldoFinal = mes.saldoInicial + ingresos + fItot - Math.max(total, diario) - fGtot - progTot;
  const saldoCierre = mes.saldoInicial + ingresos + fItot - total - fGtot - progTot;
  const base = nDias ? diario / nDias : 0;
  const esActual = y===hoy.getFullYear() && (m-1)===hoy.getMonth();
  const esPasado = new Date(y, m, 1) <= new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  return {mes,k,y,m,nDias,fijos,fG,fI,progs,progMax,fGmax,extraF,reserva,total,totalCred,gastosDeb,gastosCred,progsCred,cobroCred: primerLunes(mesSiguiente(k)),ingresos,extra,limEf,diario,queda,
    fGtot,fItot,progTot,fGcob,fIcob,progCob,saldoActual,saldoFinal,saldoCierre,base,esActual,esPasado};
}
// Hucha diaria al final del día d
const huchaDia = (c, d) => c.base*d - c.gastosDeb.filter(g=>parseInt(g.fecha.slice(8,10),10)<=d).reduce((s,g)=>s+g.importe,0);
function diasEnRojo(c){
  const hasta = c.esActual ? hoy.getDate() : (c.esPasado ? c.nDias : 0);
  let n = 0; for(let d=1; d<=hasta; d++) if(huchaDia(c,d) < -0.005) n++;
  return {n, de: hasta};
}
const mesAnterior = k => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m-2, 1); return claveMes(d.getFullYear(), d.getMonth()); };

function saldoSugerido(k){
  const c = calcMes(mesAnterior(k));
  if(!c) return '';
  return r2(c.esPasado ? c.saldoCierre : c.saldoFinal);
}
function limiteSugerido(){
  const claves = Object.keys(estado.meses).sort();
  for(let i=claves.length-1;i>=0;i--){ if(estado.meses[claves[i]].limite) return estado.meses[claves[i]].limite; }
  return '';
}
// Máximo recomendado: lo que puedes gastar para acabar el mes con el ahorro que quieres
function recomendar(k, saldoAhora, ahorro){
  const mes = estado.meses[k] || {gastos:[], ingresos:[]};
  const fijos = fijosDelMes(k);
  const fG = fijos.filter(f=>f.tipo!=='ingreso'), fI = fijos.filter(f=>f.tipo==='ingreso');
  const progs = progsConLiq(k);
  const total = suma((mes.gastos||[]).filter(g=>!esCredito(g))), ingresos = totalIngresos(mes), extra = extraLimite(mes);
  const saldoInicio = saldoAhora + total - ingresos - suma(fI.filter(cobrado)) + suma(fG.filter(cobrado)) + suma(progs.filter(cobrado));
  const progMax = suma(progs.filter(p=>p.enMaximo)), progFuera = suma(progs.filter(p=>!p.enMaximo));
  const ingNoLim = ingresos - extra;
  // Los ingresos fijos que aún no han llegado (como la nómina a fin de mes) no se cuentan para gastar:
  // así nunca te quedas en negativo antes de cobrarlos.
  // Los ingresos fijos que suman al máximo ya lo amplían por su cuenta; los pagos fijos que cuentan en el máximo van dentro de él
  const fInoLim = fI.filter(f=>!f.alLimite);
  const fIcob = suma(fInoLim.filter(cobrado)), fIpend = suma(fInoLim) - fIcob;
  const fGfuera = suma(fG.filter(f=>!f.enMaximo)), fGmax = suma(fG.filter(f=>f.enMaximo));
  const M = saldoInicio + ingNoLim + fIcob - fGfuera - progFuera - ahorro;
  return {M: r2(M), saldoInicio: r2(saldoInicio), ingresos: r2(ingNoLim + fIcob), ingPend: r2(fIpend), pagos: r2(fGfuera), progFuera: r2(progFuera), progMax: r2(progMax + fGmax), ahorro};
}

      <p class="rec-cifra num">${fmt(Math.max(r.M,0))}</p>
      <div class="rec-desglose">${filas.map(f=>`<div><span>${f[2]} ${f[0]}</span><span class="num">${fmt(f[1])}</span></div>`).join('')}</div>
      ${r.ingPend ? `<p class="rec-nota">No cuenta ${fmt(r.ingPend)} de ingresos fijos que aún no has cobrado este mes (como la nómina): se quedarán como ahorro o para el mes siguiente.</p>`:''}
      ${r.progMax ? `<p class="rec-nota">${fmt(r.progMax)} de ese máximo ya están reservados para pagos fijos y gastos programados que cuentan en él (preventas, cargo de la tarjeta de crédito…).</p>`:''}
      ${!ok ? `<p class="rec-nota">Con tus pagos de este mes no te queda margen para el día a día. Prueba a reducir el ahorro.</p>`:''}
      ${ok ? `<button class="usar-rec" id="usar-rec">Usar ${fmt(r.M)}</button>`:''}
    </div>`;
    const u = document.getElementById('usar-rec');
    if(u) u.onclick = ()=>{ document.getElementById('lim').value = r.M.toFixed(2).replace('.',','); };
  };
  ['saldo','ahorro'].forEach(id=>document.getElementById(id).addEventListener('input', pintarRec));
  pintarRec();
  if(!limVal){ const s = num(document.getElementById('saldo').value); if(!isNaN(s)){ const r = recomendar(k, s, num(document.getElementById('ahorro').value)||0); if(r.M>r.progMax) document.getElementById('lim').placeholder = r.M.toFixed(2).replace('.',','); } }

  const ok = async ()=>{
    const saldo = num(document.getElementById('saldo').value);
    const ahorro = num(document.getElementById('ahorro').value) || 0;
    const lim = num(document.getElementById('lim').value);
    const err = document.getElementById('cfg-err');
    if(isNaN(saldo)){ err.textContent = 'Escribe el dinero que tienes en el banco.'; return; }
    if(!(lim>0)){ err.textContent = 'Escribe un máximo de gasto mayor que cero (o pulsa «Usar» en el recomendado).'; return; }
    estado.meses[k] = estado.meses[k] || {gastos:[], ingresos:[]};
    const r = recomendar(k, saldo, ahorro);
    estado.meses[k].limite = lim;
    estado.meses[k].ahorro = ahorro;
    estado.meses[k].saldoInicial = r.saldoInicio;
    estado.ajustes = {...(estado.ajustes||{}), ahorro};
    editandoLimite = false;
    render(); await guardar();
  };
  document.getElementById('guardar-lim').onclick = ok;
  const cn = document.getElementById('cancelar'); if(cn) cn.onclick = ()=>{ editandoLimite=false; render(); };
  ['saldo','ahorro','lim'].forEach(id=>document.getElementById(id).onkeydown = e=>{ if(e.key==='Enter') ok(); });
}

function bloqueDiario(c){
  if(c.esPasado && !c.esActual) return bloqueResumen(c);
  if(c.diario <= 0){
    return `<div class="diario mal"><p class="etq-diario">Sin margen para el día a día</p><p class="grande num negativo">${fmt(c.diario)}</p>
      <p class="sub">Los pagos fijos y gastos programados que cuentan en tu máximo ocupan todo el presupuesto del mes. Sube el máximo o márcalos para que no cuenten.</p></div>`;
  }
  if(!c.esActual){
    // Mes que aún no ha empezado: lo que queda (ya restado lo apuntado) repartido entre todos sus días
    const descontado = [c.total?`${fmt(c.total)} ya apuntados`:'', c.reserva?`${fmt(c.reserva)} reservados`:''].filter(Boolean).join(' y ');
    return `<div class="diario"><p class="etq-diario">Podrás gastar</p><p class="grande num">${fmt(c.queda / c.nDias)} al día</p>
      <p class="sub">durante los ${c.nDias} días del mes${descontado?` · descontados ${descontado}`:''}</p></div>`;
  }
  const d = hoy.getDate();
  const hucha = huchaDia(c, d);
  const gastadoHoy = c.gastosDeb.filter(g=>g.fecha===isoHoy).reduce((s,g)=>s+g.importe,0);
  const diasRestantes = c.nDias - d + 1;
  const mediaResto = diasRestantes > 1 ? c.queda / (diasRestantes - 1) : null;
  const lineaMedia = mediaResto!==null ? `<br>Media para el resto del mes: ${fmt(mediaResto)} al día` : '';
  if(hucha >= 0){
    return `<div class="diario"><p class="etq-diario">Hoy puedes gastar</p><p class="grande num">${fmt(hucha)}</p>
      <p class="sub">Cada día se suman ${fmt(c.base)} · hoy llevas ${fmt(gastadoHoy)}<br>Lo que no gastes se acumula para mañana${lineaMedia}</p></div>`;
  }
  const diasRecuperar = Math.ceil(-hucha / c.base);
  return `<div class="diario mal"><p class="etq-diario">Vas en negativo</p><p class="grande num negativo">${fmt(hucha)}</p>
    <p class="sub">Cada día se suman ${fmt(c.base)} · hoy llevas ${fmt(gastadoHoy)}<br>Si no gastas nada, lo compensarás ${diasRecuperar===1?'mañana':`en ${diasRecuperar} días`}${lineaMedia}</p></div>`;
}

function bloqueResumen(c){
  const todos = [...c.mes.gastos, ...c.progs.filter(p=>!p.auto), ...c.progsCred];
  const mayor = todos.slice().sort((a,b)=>b.importe-a.importe)[0];
  const porCat = {}; todos.forEach(g=>{ const id = catDe(g); porCat[id] = (porCat[id]||0) + g.importe; });
  const topCat = Object.entries(porCat).sort((a,b)=>b[1]-a[1])[0];
  const rojo = diasEnRojo(c);
  const ahorrado = c.saldoCierre - c.mes.saldoInicial;
  const prev = calcMes(mesAnterior(c.k));
  let comp = '';
  if(prev && prev.total + prev.reserva > 0){
    const a = c.total + c.reserva, b = prev.total + prev.reserva;
    const pct = Math.round((a-b)/b*100);
    const [py,pm] = prev.k.split('-').map(Number);
    comp = `<div class="res-fila"><span>Frente a ${nombreMes(py,pm-1).split(' ')[0].toLowerCase()}</span><span class="num ${pct>0?'txt-mal':'txt-bien'}">${pct>0?'+':''}${pct} %</span></div>`;
  }
  const dentro = c.queda >= 0;
  return `<div class="diario resumen ${dentro?'':'mal'}">
    <p class="etq-diario">Resumen del mes</p>
    <p class="grande num ${dentro?'':'negativo'}">${dentro?`Te sobraron ${fmt(c.queda)}`:`Te pasaste ${fmt(-c.queda)}`}</p>
    <div class="res-tabla">
      <div class="res-fila"><span>Gastado del máximo</span><span class="num">${fmt(c.total + c.reserva)} de ${fmt(c.limEf)}</span></div>
      <div class="res-fila"><span>${ahorrado>=0?'Ahorrado en el banco':'El banco bajó'}</span><span class="num ${ahorrado>=0?'txt-bien':'txt-mal'}">${fmt(Math.abs(ahorrado))}</span></div>
      <div class="res-fila"><span>Días en rojo</span><span class="num">${rojo.n} de ${rojo.de}</span></div>
      ${mayor?`<div class="res-fila"><span>Mayor gasto</span><span class="num">${esc(mayor.concepto||'Sin concepto')} · ${fmt(mayor.importe)}</span></div>`:''}
      ${topCat?`<div class="res-fila"><span>Donde más gastaste</span><span>${catInfo(topCat[0]).e} ${catInfo(topCat[0]).n} · ${fmt(topCat[1])}</span></div>`:''}
      ${comp}
    </div></div>`;
}

function bloqueBarra(c){
  const pctRes = Math.min(100, c.reserva / c.limEf * 100);
  const pctGas = Math.min(100 - pctRes, Math.max(0, c.total / c.limEf * 100));
  const diaHoy = c.esActual ? hoy.getDate() : (c.esPasado ? c.nDias : 0);
  const ritmoPct = Math.min(100, (c.reserva + c.base*diaHoy) / c.limEf * 100);
  const color = c.queda < 0 ? 'var(--bad)' : (c.esActual && pctRes+pctGas > ritmoPct+3 ? 'var(--warn)' : 'var(--good)');
  return `<div class="barra" role="img" aria-label="Gastado ${Math.round(pctRes+pctGas)} % del máximo">
      ${pctRes>0?`<div class="reservado" style="width:${pctRes}%"></div>`:''}
      <div class="lleno" style="left:${pctRes}%;width:${pctGas}%;background:${color}"></div>
      ${c.esActual?`<div class="ritmo" style="left:${ritmoPct}%"></div>`:''}
    </div>
    <div class="leyenda"><span>Gastado ${fmt(c.total)}</span>${c.reserva?`<span><i class="muestra"></i>Reservado ${fmt(c.reserva)}</span>`:''}${c.esActual?'<span>La línea marca dónde deberías ir hoy</span>':''}</div>`;
}

function avisoCopia(){
  const hayDatos = Object.values(estado.meses).some(m=>(m.gastos||[]).length || (m.ingresos||[]).length);
  if(!hayDatos) return '';
  const ref = estado.ultimaCopia || estado.creado || Date.now();
  const dias = Math.floor((Date.now() - ref) / DIA_MS);
  if(dias < 7) return '';
  return `<div class="aviso-copia"><p>${estado.ultimaCopia ? `Hace ${dias} días que no haces una copia de seguridad.` : 'Aún no has hecho ninguna copia de seguridad.'} Tus datos solo están en este iPhone.</p>
    <button id="copia-ya">Guardar copia ahora</button></div>`;
}

function bloqueCategorias(c){
  const todos = [...c.mes.gastos, ...c.progs.filter(p=>!p.auto), ...c.progsCred];
  if(!todos.length) return '<p class="vacio">Cuando apuntes gastos verás aquí en qué se te va el dinero.</p>';
  const porCat = {}; todos.forEach(g=>{ const id = catDe(g); porCat[id] = (porCat[id]||0) + g.importe; });
  const tot = Object.values(porCat).reduce((s,v)=>s+v,0);
  const lista = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const max = lista[0][1];
  return `<div class="cats">${lista.map(([id,v])=>{ const ci = catInfo(id); return `
    <button class="cat-fila" data-cat="${id}">
      <span class="cat-emoji" aria-hidden="true">${ci.e}</span>
      <span class="cat-cuerpo"><span class="cat-cab"><span class="cat-nombre">${ci.n}</span><span class="cat-imp num">${fmt(v)}</span></span>
      <span class="cat-barra"><span style="width:${v/max*100}%"></span></span>
      <span class="cat-pct">${Math.round(v/tot*100)} % del gasto</span></span>
    </button>`; }).join('')}</div>`;
}

        <p class="error" id="g-err"></p>
        ${editMov ? `<button class="secundario-btn" id="g-cancel">Cancelar</button>
        <button class="primario mitad ${esIngreso?'verde':''}" id="g-add">Guardar cambios</button>
        <button class="peligro" id="g-del">Borrar este movimiento</button>`
        : `<button class="primario ${esIngreso?'verde':''}" id="g-add">${esIngreso?'Añadir ingreso':'Añadir gasto'}</button>`}
      </div>
    </section>

    <section>
      <div class="cab-seccion"><h2>Pagos e ingresos fijos</h2>${c.fGtot?`<span class="num total-fijos">−${fmt(c.fGtot)}</span>`:''}</div>
      <p class="copia-nota">Se descuentan (o suman) a tu dinero en el banco el día de cobro. Solo cuentan en lo que puedes gastar al día si los marcas para ello. Toca uno para modificarlo.</p>
      ${c.fG.length ? `<p class="subtitulo">Pagos</p>${c.fG.map(filaFijo).join('')}` : ''}
      ${c.fI.length ? `<p class="subtitulo">Ingresos</p>${c.fI.map(filaFijo).join('')}` : ''}
      ${!c.fijos.length ? '<p class="vacio">No tienes pagos ni ingresos fijos este mes.</p>' : ''}
      ${fijoEdit ? formFijo(k) : `<button class="ajustar" id="f-abrir">Añadir un pago o ingreso fijo</button>`}
    </section>

    <section>
      <div class="cab-seccion"><h2>Gastos programados</h2>${(c.progTot + suma(c.progsCred))?`<span class="num total-fijos">−${fmt(c.progTot + suma(c.progsCred))}</span>`:''}</div>
      ${suma(c.progsCred) ? `<p class="nota-credito">💳 ${c.progTot ? `De ese total, ${fmt(suma(c.progsCred))} van con tarjeta de crédito y se cobrarán` : 'Con tarjeta de crédito: se cobrará'} el ${fmtFecha(c.cobroCred)}, en el mes que viene.</p>` : ''}
      <p class="copia-nota">Compras ya hechas que se cobrarán en una fecha concreta, como una preventa. Se descuentan del banco el día del cobro y, si cuentan en tu máximo, se reservan desde el principio del mes.</p>
      ${(c.progs.length || c.progsCred.length) ? [...c.progs, ...c.progsCred].sort((a,b)=>a.fecha<b.fecha?-1:1).map(filaProg).join('') : '<p class="vacio">No tienes gastos programados este mes.</p>'}
      ${masProgs.length ? `<p class="copia-nota" style="margin-top:10px">En los próximos meses: ${masProgs.length} gasto${masProgs.length===1?'':'s'} programado${masProgs.length===1?'':'s'} (${fmt(suma(masProgs))}).</p>`:''}
      ${progEdit ? formProg(k) : `<button class="ajustar" id="p-abrir">Añadir un gasto programado</button>`}
    </section>

    <section>
      <h2>En qué gastas</h2>
      ${bloqueCategorias(c)}
    </section>

    <section>
      <h2>Gasto por día</h2>
      <div class="grafico">${grafico(c)}</div>
    </section>

    <section>
      <h2>Pagos automáticos</h2>
      <p class="copia-nota">Trae los pagos que tus atajos han ido apuntando (Apple Pay y capturas de compras en apps). Puedes importar el mismo archivo todas las veces que quieras: los pagos repetidos no se duplican.</p>
      <div class="copia">
        <label>Importar pagos<input type="file" id="importar-ap" accept=".txt,text/plain"></label>
      </div>
    </section>`;

  pintarLista(c);
  enlazar(c, k, minF, maxF);
}

// ---- Lista de movimientos (se repinta sola al buscar, sin perder el foco) ----
function pintarLista(c){
  const mes = c.mes;
  const cont = document.getElementById('lista-movs');
  let movs = [...mes.gastos.map(g=>({...g,tipo:'gasto'})), ...mes.ingresos.map(g=>({...g,tipo:'ingreso'}))];
  const q = filtro.q.trim().toLowerCase();
  const filtrando = q || filtro.tipo!=='todos';
  if(filtro.tipo==='gasto' || filtro.tipo==='ingreso') movs = movs.filter(g=>g.tipo===filtro.tipo);
  else if(filtro.tipo.startsWith('cat:')) movs = movs.filter(g=>g.tipo==='gasto' && catDe(g)===filtro.tipo.slice(4));
  if(q) movs = movs.filter(g=>[g.concepto, g.tarjeta, catInfo(catDe(g)).n].filter(Boolean).join(' ').toLowerCase().includes(q));

  const porDia = {};
  movs.forEach(g=>{ (porDia[g.fecha] = porDia[g.fecha] || []).push(g); });
  const fechas = Object.keys(porDia).sort().reverse();
  let html = '';
  if(filtrando){
    const tg = movs.filter(g=>g.tipo==='gasto').reduce((s,g)=>s+g.importe,0);
    const ti = movs.filter(g=>g.tipo==='ingreso').reduce((s,g)=>s+g.importe,0);
    html += `<p class="pista">${movs.length} movimiento${movs.length===1?'':'s'}${tg?` · gastado ${fmt(tg)}`:''}${ti?` · ingresado ${fmt(ti)}`:''} · <button class="enlace" id="quitar-filtro">Quitar filtro</button></p>`;
  } else if(fechas.length) html += '<p class="pista">Toca un movimiento para modificarlo o borrarlo.</p>';

  html += fechas.length ? fechas.map(f=>{
    const d = new Date(f+'T12:00:00');
    const diaTxt = d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric'}).replace(',','');
    const etiqueta = (f===isoHoy ? 'Hoy · ' : '') + diaTxt.charAt(0).toUpperCase()+diaTxt.slice(1);
    const items = porDia[f].slice().sort((a,b)=>(b.hora||0)-(a.hora||0));
    const gastoDia = items.filter(g=>g.tipo==='gasto' && !esCredito(g)).reduce((s,g)=>s+g.importe,0);
    const credDia = items.filter(g=>g.tipo==='gasto' && esCredito(g)).reduce((s,g)=>s+g.importe,0);
    return `<div class="dia"><div class="dia-cab"><span class="dia-nombre">${etiqueta}</span><span class="num dia-total">${[gastoDia>0?'Gastado '+fmt(gastoDia):'', credDia>0?'💳 '+fmt(credDia):''].filter(Boolean).join(' · ')}</span></div>
      <div class="dia-lista">${items.map(g=>{
        const concepto = g.concepto || (g.tipo==='ingreso'?'Ingreso':'Sin concepto');
        const hora = g.hora ? new Date(g.hora).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '';
        const origen = g.origen==='applepay'?'Apple Pay':g.origen==='cartera'?'Cartera':g.origen==='captura'?'Compra en app':(g.tipo==='ingreso'?'Ingreso':'Manual');
        const ci = catInfo(catDe(g));
        const cred = g.tipo==='gasto' && esCredito(g);
        const meta = [hora, g.tipo==='gasto'?ci.n:'', origen, g.tarjeta, cred && !g.tarjeta ? 'Crédito' : '', g.alLimite?'suma al máximo':''].filter(Boolean).join(' · ');
        return `<div class="gasto ${g.tipo} ${editMov && editMov.id===g.id?'editando':''}" data-id="${g.id}" data-tipo="${g.tipo}" role="button" tabindex="0" aria-label="Modificar movimiento">
          <span class="avatar" aria-hidden="true">${g.tipo==='ingreso'?'+':ci.e}</span>
          <span class="info"><span class="concepto">${esc(concepto)}</span><span class="meta">${esc(meta)}</span>${cred?`<span class="etq-credito">💳 Se cobra el ${fmtFecha(c.cobroCred)}</span>`:''}</span>
          <span class="imp num ${cred?'credito':''}">${g.tipo==='ingreso'?'+':'−'}${fmt(g.importe)}</span></div>`; }).join('')}</div></div>`;
  }).join('') : (filtrando ? '<p class="vacio">No hay movimientos que coincidan.</p>' : '<p class="vacio">Aún no has apuntado ningún movimiento este mes. Empieza con el primero más abajo.</p>');
  cont.innerHTML = html;

  const qf = document.getElementById('quitar-filtro');
  if(qf) qf.onclick = ()=>{ filtro = {q:'', tipo:'todos'}; document.getElementById('f-q').value=''; document.getElementById('f-tipo').value='todos'; pintarLista(c); };
  cont.querySelectorAll('.gasto[data-id]').forEach(row=>{
    const abrir = ()=>{
      editMov = {id: row.dataset.id, tipo: row.dataset.tipo};
      tipoMov = row.dataset.tipo;
      render();
      document.getElementById('form-mov').scrollIntoView({behavior:'smooth', block:'start'});
    };
    row.onclick = abrir;
    row.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } };
  });
}

// ---- Eventos de la pantalla principal ----
function enlazar(c, k, minF, maxF){
  const mes = c.mes;
  const $ = id => document.getElementById(id);

  const cy = $('copia-ya'); if(cy) cy.onclick = ()=>exportarCopia();
  $('editar').onclick = ()=>{ editandoLimite = true; render(); window.scrollTo(0,0); };
  $('ajustar').onclick = async ()=>{
    const r = prompt('¿Cuánto te aparece ahora en el banco? (€)', String(r2(c.saldoActual)).replace('.',','));
    if(r===null) return;
    const v = num(r);
    if(isNaN(v)){ alert('Escribe solo la cantidad, por ejemplo 1234,56'); return; }
    mes.saldoInicial = r2(v - (c.saldoActual - mes.saldoInicial));
    render(); await guardar();
  };
  const vr = $('ver-resumen');
  if(vr) vr.onclick = ()=>{ vista.m--; if(vista.m<0){vista.m=11;vista.y--;} editMov=null; fijoEdit=null; progEdit=null; render(); window.scrollTo(0,0); };

  // Filtros
  $('f-q').oninput = e=>{ filtro.q = e.target.value; pintarLista(c); };
  $('f-tipo').onchange = e=>{ filtro.tipo = e.target.value; pintarLista(c); };
  document.querySelectorAll('.cat-fila').forEach(b=>b.onclick = ()=>{
    filtro = {q:'', tipo:'cat:'+b.dataset.cat};
    $('f-q').value = ''; $('f-tipo').value = filtro.tipo; pintarLista(c);
    $('sec-movs').scrollIntoView({behavior:'smooth', block:'start'});
  });

  // Formulario de movimientos
  document.querySelectorAll('#form-mov .selector button').forEach(b=>b.onclick = ()=>{
    const imp = $('g-imp').value, con = $('g-con').value, fe = $('g-fecha').value;
    tipoMov = b.dataset.tipo; render();
    $('g-imp').dataset.relleno = '1';
    $('g-imp').value = imp; $('g-con').value = con; $('g-fecha').value = fe;
  });
  const movEditado = editMov ? (editMov.tipo==='ingreso'?mes.ingresos:mes.gastos).find(g=>g.id===editMov.id) : null;
  if(editMov && !movEditado) editMov = null;
  if(movEditado && !$('g-imp').dataset.relleno){
    $('g-imp').value = movEditado.importe.toFixed(2).replace('.',',');
    $('g-con').value = movEditado.concepto || '';
    $('g-fecha').value = movEditado.fecha;
    if($('g-lim')) $('g-lim').checked = !!movEditado.alLimite;
    if($('g-cat')) $('g-cat').value = movEditado.cat || '';
    if($('g-pago')) $('g-pago').value = esCredito(movEditado) ? 'credito' : 'debito';
  }
  const gd = $('g-del');
  if(gd) gd.onclick = async ()=>{
    if(!confirm('¿Borrar este movimiento?')) return;
    if(editMov.tipo==='ingreso') mes.ingresos = mes.ingresos.filter(g=>g.id!==editMov.id);
    else mes.gastos = mes.gastos.filter(g=>g.id!==editMov.id);
    editMov = null; render(); await guardar();
  };
  const gc = $('g-cancel'); if(gc) gc.onclick = ()=>{ editMov = null; render(); };
  const add = async ()=>{
    const imp = num($('g-imp').value);
    const fecha = $('g-fecha').value;
    const err = $('g-err');
    if(!(imp>0)){ err.textContent = 'Escribe un importe mayor que cero.'; return; }
    if(!fecha || fecha<minF || fecha>maxF){ err.textContent = 'Elige una fecha de este mes.'; return; }
    // Al modificar se conservan los datos de origen (hora, tarjeta, Apple Pay…)
    const base = movEditado ? {...movEditado} : {id: nuevoId()};
    const mov = {...base, importe: imp, concepto: $('g-con').value.trim(), fecha};
    if(tipoMov==='ingreso'){ mov.alLimite = $('g-lim').checked; delete mov.cat; }
    else {
      delete mov.alLimite; const cat = $('g-cat').value; if(cat) mov.cat = cat; else delete mov.cat;
      const cred = $('g-pago').value==='credito';
      // Solo se guarda si cambia lo que se deduce de la tarjeta importada
      if(cred === /cr[eé]dito/i.test(mov.tarjeta||'')) delete mov.credito; else mov.credito = cred;
    }
    const eraEdicion = !!editMov;
    if(editMov){
      if(editMov.tipo==='ingreso') mes.ingresos = mes.ingresos.filter(g=>g.id!==editMov.id);
      else mes.gastos = mes.gastos.filter(g=>g.id!==editMov.id);
      editMov = null;
    }
    if(tipoMov==='ingreso') mes.ingresos.push(mov); else mes.gastos.push(mov);
    render(); await guardar();
    if(!eraEdicion) $('g-imp').focus();
  };
  $('g-add').onclick = add;
  ['g-imp','g-con'].forEach(id=>$(id).onkeydown = e=>{ if(e.key==='Enter') add(); });

  // Importar pagos de los atajos
  $('importar-ap').onchange = async e=>{
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    try{
      const r = importarApplePay(await f.text());
      render(); await guardar();
      let msg = r.nuevos ? `Importados ${r.nuevos} pago${r.nuevos===1?'':'s'} nuevo${r.nuevos===1?'':'s'}.` : 'No había pagos nuevos.';
      if(r.ignorados) msg += ` ${r.ignorados} pago${r.ignorados===1?' es':'s son'} de antes de noviembre de 2026 y no se ha${r.ignorados===1?'':'n'} añadido.`;
      if(r.duplicados) msg += ` ${r.duplicados} repetido${r.duplicados===1?'':'s'} (no se ha${r.duplicados===1?'':'n'} vuelto a añadir).`;
      if(r.malos) msg += ` ${r.malos} línea${r.malos===1?'':'s'} no se pudo leer.`;
      alert(msg);
    }catch(err){ alert('No se pudo leer ese archivo.'); }
  };

  // Pagos e ingresos fijos
  document.querySelectorAll('.fijo[data-fid]').forEach(row=>{
    const abrir = ()=>{ fijoEdit = row.dataset.fid; const f = estado.fijos.find(x=>x.id===fijoEdit); fijoTipo = f?.tipo||'gasto'; render(); $('fijo-form').scrollIntoView({behavior:'smooth', block:'center'}); };
    row.onclick = abrir; row.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } };
  });
  const fa = $('f-abrir'); if(fa) fa.onclick = ()=>{ fijoEdit = 'nuevo'; fijoTipo = 'gasto'; render(); $('f-nom').focus(); };
  document.querySelectorAll('#fijo-form [data-ft]').forEach(b=>b.onclick = ()=>{
    const vals = ['f-nom','f-imp','f-dia','f-cuo','f-aj'].map(id=>$(id)?$(id).value:null);
    const marcado = $('f-max').checked;
    fijoTipo = b.dataset.ft; render();
    ['f-nom','f-imp','f-dia','f-cuo','f-aj'].forEach((id,i)=>{ if($(id) && vals[i]!==null) $(id).value = vals[i]; });
    $('f-max').checked = marcado;
  });
  const fcn = $('f-cancel'); if(fcn) fcn.onclick = ()=>{ fijoEdit = null; render(); };
  const fad = $('f-add');
  if(fad) fad.onclick = async ()=>{
    const nombre = $('f-nom').value.trim();
    const imp = num($('f-imp').value);
    const dia = parseInt($('f-dia').value,10);
    const cuoTxt = $('f-cuo').value.trim();
    const cuotas = cuoTxt ? parseInt(cuoTxt,10) : null;
    const err = $('f-err');
    if(!nombre){ err.textContent = 'Ponle un nombre.'; return; }
    if(!(imp>0)){ err.textContent = 'Escribe un importe mayor que cero.'; return; }
    if(!(dia>=1 && dia<=31)){ err.textContent = 'El día de cobro tiene que estar entre 1 y 31.'; return; }
    if(cuoTxt && !(cuotas>=1)){ err.textContent = 'El número de cuotas tiene que ser 1 o más, o déjalo vacío.'; return; }
    estado.fijos = estado.fijos || [];
    const marca = $('f-max').checked;
    const extraDatos = fijoTipo==='ingreso' ? {alLimite: marca} : {enMaximo: marca};
    if(fijoEdit==='nuevo'){
      estado.fijos.push({id: nuevoId(), nombre, importe: imp, dia, desde: k, cuotas, tipo: fijoTipo, ...extraDatos});
    } else {
      const f = estado.fijos.find(x=>x.id===fijoEdit);
      delete f.alLimite; delete f.enMaximo;
      Object.assign(f, {nombre, importe: imp, dia, cuotas, tipo: fijoTipo, ...extraDatos});
      const ajTxt = $('f-aj') ? $('f-aj').value.trim() : '';
      f.ajustes = f.ajustes || {};
      if(ajTxt){ const aj = num(ajTxt); if(!(aj>=0)){ err.textContent = 'El importe de este mes no es válido.'; return; } f.ajustes[k] = aj; }
      else delete f.ajustes[k];
    }
    fijoEdit = null; render(); await guardar();
  };
  const fdl = $('f-del');
  if(fdl) fdl.onclick = async ()=>{
    const f = estado.fijos.find(x=>x.id===fijoEdit);
    if(!f) return;
    if(idxMes(f.desde) >= idxMes(k)){
      if(!confirm(`¿Quitar «${f.nombre}»? Se borrará por completo.`)) return;
      estado.fijos = estado.fijos.filter(x=>x.id!==f.id);
    } else {
      if(!confirm(`¿Dejar de contar «${f.nombre}» desde ${nombreMes(vista.y,vista.m).toLowerCase()}? Los meses anteriores no cambian.`)) return;
      f.hasta = mesAnterior(k);
    }
    fijoEdit = null; render(); await guardar();
  };

  // Gastos programados
  document.querySelectorAll('.prog[data-pid]').forEach(row=>{
    const abrir = ()=>{ progEdit = row.dataset.pid; render(); $('prog-form').scrollIntoView({behavior:'smooth', block:'center'}); };
    row.onclick = abrir; row.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } };
  });
  const pa = $('p-abrir'); if(pa) pa.onclick = ()=>{ progEdit = 'nuevo'; render(); $('p-con').focus(); };
  const pcn = $('p-cancel'); if(pcn) pcn.onclick = ()=>{ progEdit = null; render(); };
  const pcr = $('p-cred'); if(pcr) pcr.onchange = ()=>{ $('p-max-fila').hidden = pcr.checked; $('p-cred-nota').hidden = !pcr.checked; };
  const pad_ = $('p-add');
  if(pad_) pad_.onclick = async ()=>{
    const concepto = $('p-con').value.trim();
    const imp = num($('p-imp').value);
    const fecha = $('p-fecha').value;
    const cat = $('p-cat').value;
    const err = $('p-err');
    if(!concepto){ err.textContent = 'Ponle un nombre.'; return; }
    if(!(imp>0)){ err.textContent = 'Escribe un importe mayor que cero.'; return; }
    if(!fecha || fecha < '2026-11-01'){ err.textContent = 'Elige una fecha desde noviembre de 2026.'; return; }
    estado.programados = estado.programados || [];
    const credito = $('p-cred').checked;
    const datos = {concepto, importe: imp, fecha, enMaximo: credito ? true : $('p-max').checked, credito};
    if(cat) datos.cat = cat;
    if(progEdit==='nuevo') estado.programados.push({id: nuevoId(), ...datos});
    else { const p = estado.programados.find(x=>x.id===progEdit); delete p.cat; Object.assign(p, datos); }
    progEdit = null; render(); await guardar();
  };
  const pdl = $('p-del');
  if(pdl) pdl.onclick = async ()=>{
    if(!confirm('¿Borrar este gasto programado?')) return;
    estado.programados = estado.programados.filter(x=>x.id!==progEdit);
    progEdit = null; render(); await guardar();
  };
}

// ---- Gráfico de gasto por día ----
function grafico(c){
  const nDias = c.nDias;
  const sumas = Array(nDias).fill(0);
  c.gastosDeb.forEach(g=>{ const d = parseInt(g.fecha.slice(8,10),10); if(d>=1&&d<=nDias) sumas[d-1]+=g.importe; });
  const media = Math.max(c.base, 0);
  const max = Math.max(media*1.6, ...sumas, 1);
  const W=360, H=140, top=10, base=H-22, bw=W/nDias;
  const y = v => base - (v/max)*(base-top);
  let barras = '';
  sumas.forEach((v,i)=>{
    const h = base - y(v);
    const col = v>media ? 'var(--warn)' : 'var(--good)';
    if(v>0) barras += `<rect x="${i*bw+1}" y="${y(v)}" width="${bw-2}" height="${h}" rx="2" fill="${col}"><title>Día ${i+1}: ${fmt(v)}</title></rect>`;
    if(c.esActual && i===hoy.getDate()-1) barras += `<rect x="${i*bw+0.5}" y="${top}" width="${bw-1}" height="${base-top}" fill="none" stroke="var(--accent)" stroke-dasharray="2 2" rx="2"/>`;
    if((i+1)%5===0 || i===0) barras += `<text x="${i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto diario del mes frente a la media permitida">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>
    ${barras}
    <line x1="0" x2="${W}" y1="${y(media)}" y2="${y(media)}" stroke="var(--ink)" stroke-opacity=".5" stroke-dasharray="4 3"/>
    <text x="${W-2}" y="${y(media)-4}" text-anchor="end" font-size="9" fill="var(--muted)">media permitida ${fmt(media)}/día</text>
  </svg>`;
}

// =====================================================================
//  Copias de seguridad y exportación
// =====================================================================
async function compartirArchivo(contenido, nombre, tipo, titulo){
  const blob = new Blob([contenido],{type:tipo});
  const file = new File([blob], nombre, {type:tipo});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:titulo});
      return true;
    }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  return true;
}
async function exportarCopia(){
  const ok = await compartirArchivo(JSON.stringify(estado,null,2), `presupuesto-${isoHoy}.json`, 'application/json', 'Copia de mi presupuesto');
  if(ok){ estado.ultimaCopia = Date.now(); await guardar(); render(); }
}
function pintarUltimaCopia(){
  const el = document.getElementById('ultima-copia');
  if(!el) return;
  if(!estado.ultimaCopia){ el.textContent = 'Aún no has hecho ninguna copia.'; return; }
  const dias = Math.floor((Date.now()-estado.ultimaCopia)/DIA_MS);
  el.textContent = dias===0 ? 'Última copia: hoy.' : dias===1 ? 'Última copia: ayer.' : `Última copia: hace ${dias} días.`;
}
function exportarCSV(todos){
  const claves = todos ? Object.keys(estado.meses).sort() : [claveMes(vista.y,vista.m)];
  const cel = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const imp = n => n.toFixed(2).replace('.',',');
  const fFecha = f => f.split('-').reverse().join('/');
  const filas = [['Fecha','Tipo','Concepto','Categoría','Importe','Origen','Tarjeta']];
  claves.forEach(k=>{
    const mes = estado.meses[k]; if(!mes) return;
    const lista = [];
    (mes.gastos||[]).forEach(g=>lista.push([g.fecha, esCredito(g)?'Gasto con crédito':'Gasto',g.concepto||'',catInfo(catDe(g)).n,-g.importe,
      g.origen==='applepay'?'Apple Pay':g.origen==='cartera'?'Cartera':g.origen==='captura'?'Compra en app':'Manual', g.tarjeta||'']));
    (mes.ingresos||[]).forEach(g=>lista.push([g.fecha,'Ingreso',g.concepto||'','',g.importe,'Manual','']));
    fijosDelMes(k).forEach(f=>lista.push([f.fecha, f.tipo==='ingreso'?'Ingreso fijo':'Pago fijo', f.nombre,'', f.tipo==='ingreso'?f.importe:-f.importe,'Fijo','']));
    progsCredito(k).forEach(p=>lista.push([p.fecha,'Gasto programado con crédito',p.concepto,catInfo(catDe(p)).n,-p.importe,'Programado','']));
    progsConLiq(k).forEach(p=>lista.push([p.fecha, p.auto?'Cargo tarjeta de crédito':'Gasto programado', p.concepto, p.auto?'':catInfo(catDe(p)).n, -p.importe, p.auto?'Automático':'Programado','']));
    lista.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).forEach(r=>filas.push([fFecha(r[0]),r[1],r[2],r[3],imp(r[4]),r[5],r[6]]));
  });
  const csv = '\ufeff' + filas.map(r=>r.map(cel).join(';')).join('\r\n');
  const nombre = todos ? `movimientos-todos-${isoHoy}.csv` : `movimientos-${claves[0]}.csv`;
  compartirArchivo(csv, nombre, 'text/csv', 'Movimientos');
}

document.getElementById('prev').onclick = ()=>{
  if(vista.y*12+vista.m <= INICIO.y*12+INICIO.m) return;
  vista.m--; if(vista.m<0){vista.m=11;vista.y--;} editandoLimite=false; editMov=null; fijoEdit=null; progEdit=null; render();
};
document.getElementById('next').onclick = ()=>{ vista.m++; if(vista.m>11){vista.m=0;vista.y++;} editandoLimite=false; editMov=null; fijoEdit=null; progEdit=null; render(); };

    {id:'pc', nombre:'PC nuevo', importe:354.25, dia:3, desde:'2026-11', cuotas:9},
    {id:'ipad', nombre:'iPad (última cuota)', importe:175, dia:26, desde:'2026-11', cuotas:1}
  ];
}

  // Preventas de Amazon: se cargan en la tarjeta de crédito el 26 de noviembre y el banco las cobra el 7 de diciembre
  estado.programados = [
    {id:'preventa1', concepto:'Preventa Amazon', importe:64.95, fecha:'2026-11-26', enMaximo:true, credito:true, cat:'compras'},
    {id:'preventa2', concepto:'Preventa Amazon (2)', importe:295.95, fecha:'2026-11-26', enMaximo:true, credito:true, cat:'compras'}
  ];
}
if(!estado.ajustes) estado.ajustes = {ahorro:0};
if(!estado.creado) estado.creado = Date.now();

render();

if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

document.getElementById('exportar').onclick = ()=>exportarCopia();
document.getElementById('csv-mes').onclick = ()=>exportarCSV(false);
document.getElementById('csv-todo').onclick = ()=>exportarCSV(true);
document.getElementById('importar').onchange = async e=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  const aviso = document.getElementById('aviso');
  try{
    const datos = JSON.parse(await f.text());
    if(!datos || typeof datos.meses!=='object') throw 0;
    if(!confirm('Esto sustituirá los datos actuales por los de la copia. ¿Continuar?')) return;
    estado = datos; editandoLimite = false;
    if(!estado.programados) estado.programados = [];
    if(!estado.ajustes) estado.ajustes = {ahorro:0};
    render(); await guardar();
    aviso.textContent = 'Copia restaurada.';
  }catch(err){
    aviso.textContent = 'Ese archivo no es una copia válida de esta app.';
  }
};

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
